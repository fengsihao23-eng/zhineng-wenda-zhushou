name: intelligent-qa

services:
  # PostgreSQL 数据库
  db:
    image: pgvector/pgvector:pg15
    container_name: intelligent-qa-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intelligent_qa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-intelligent_qa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: intelligent-qa-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI 后端
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: intelligent-qa-api
    environment:
      # Compose defaults to production. Use DEPLOY_APP_ENV=development only
      # for a deliberate local development run.
      APP_ENV: ${DEPLOY_APP_ENV:-production}
      DEBUG: ${DEPLOY_DEBUG:-false}
      APP_NAME: ${APP_NAME:-智能问答助手}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-intelligent_qa}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
      MAX_TOKENS: ${MAX_TOKENS:-2000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-30}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-1000}
      API_WORKERS: ${API_WORKERS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    # Token revocations are persisted in PostgreSQL and shared by all workers.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-1}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # React 前端
  web:
    container_name: intelligent-qa-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: /api/v1
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Public gateway. Backend and frontend ports stay private on app-network.
  nginx:
    image: nginx:1.27-alpine
    container_name: intelligent-qa-nginx
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Set TLS_ENABLED=true after mounting certs under infra/nginx/certs.
      TLS_ENABLED: ${TLS_ENABLED:-false}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
