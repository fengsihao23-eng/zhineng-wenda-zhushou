function openSearch(){closeDetail();$('#search').showModal();search();$('#searchInput').focus()}
function selectResult(i){const r=results[i];if(!r)return;$('#search').close();if(r.flow){navigateFlow(r.flow);if(r.node)setTimeout(()=>showNode(r.flow,r.node),90)}else{location.hash=r.section;if(r.material!=null)setTimeout(()=>{const input=$('#materialFilter');if(input){input.value=B.materials[r.material][0];input.dispatchEvent(new Event('input'))}},90)}}
function preparePrint(mode=printMode){const chosen=mode==='current'&&currentFlow?[flows.get(currentFlow)]:[...flows.values()];$('#printRoot').innerHTML=(mode==='all'?`<section class="print-cover"><p>智能问答助手 · 业务版 2.0</p><h1>从一次考试，<br>到教学分析与学生答疑</h1><p>按角色泳道展示：触发、动作、分支、退回、交接与完成。</p><p>${B.stats.flows} 张业务流程图 · ${B.stats.decisions} 处业务判断 · ${B.stats.materials} 类业务资料</p><p>2026.09.20 · 基于当前实现梳理；虚线活动标示校内人工办理。</p></section>`:'')+chosen.map(f=>`<section class="print-flow">${flowMarkup(f,'print')}</section>`).join('')+(mode==='all'?`<section class="print-appendix">${heading(sections.get('materials'))}${materialsMarkup()}</section><section class="print-appendix">${heading(sections.get('operations'))}${operationsMarkup()}</section>`:'')}
function startPrint(mode){printMode=mode;toast('正在准备业务流程打印版…');preparePrint(mode);setTimeout(()=>window.print(),120)}
document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.openFlow){closeDetail();navigateFlow(target.dataset.openFlow);return}if(target.dataset.node&&target.dataset.flow){showNode(target.dataset.flow,target.dataset.node);return}if(target.dataset.action){graphAction(target.dataset.action);return}if(target.dataset.result!=null)selectResult(Number(target.dataset.result))});
$('#closeDetail').addEventListener('click',closeDetail);$('#detail').addEventListener('close',clearHighlight);$('#searchBtn').addEventListener('click',openSearch);$('#closeSearch').addEventListener('click',()=>$('#search').close());$('#searchInput').addEventListener('input',search);$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&results.length)selectResult(0);if(e.key==='ArrowDown'){$('.search-item')?.focus();e.preventDefault()}});$('#menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#backdrop').hidden=!open;$('#menu').setAttribute('aria-expanded',String(open))});$('#backdrop').addEventListener('click',closeNav);$('#printAll').addEventListener('click',()=>startPrint('all'));window.addEventListener('beforeprint',()=>preparePrint());window.addEventListener('hashchange',route);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeNav()});
$('#nav').innerHTML=B.sections.map((s,i)=>`<a class="nav-link" data-nav="${s.id}" href="#${s.id}"><span class="nav-num">${String(i).padStart(2,'0')}</span><b>${escapeHTML(s.title)}</b>${s.flows.length?`<span class="nav-count">${s.flows.length}</span>`:''}</a>`).join('');route();
</script></body></html>
