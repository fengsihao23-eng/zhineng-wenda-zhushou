 67          \"subject_scores\": [\"get_subject_scores\"],\n  68          \"ranking_change\": [\"get_rank_change\"],\n  69          \"score_trend\": [\"get_score_trend\"],\n  70          \"question_loss\": [\"get_question_losses\"],\n  71          \"diagnosis\": [\"get_diagnosis\"],\n  72      }\n  73  \n  74      def __init__(self):\n  75          pass\n  76  \n  77      def route(self, user_query: str) -> Intent:\n  78          \"\"\"\n  79          识别用户意图\n  80          Returns: Intent对象\n  81          \"\"\"\n  82          user_query_lower = user_query.lower()\n  83  \n  84          # 规则匹配\n  85          matched_intents = []\n  86  \n  87          for intent_name, patterns in self.PATTERNS.items():\n  88              for pattern in patterns:\n  89                  if re.search(pattern, user_query):\n  90                      matched_intents.append(intent_name)\n  91                      break\n  92  \n  93          # 根据匹配结果返回意图\n  94          if not matched_intents:\n  95              return Intent(\n  96                  name=\"general_chat\",\n  97                  confidence=0.5,\n  98                  suggested_tools=[],\n  99                  reasoning=\"无明确意图，使用通用对话\"\n 100              )\n 101  \n 102          # 如果有多个意图，选择第一个（优先级由顺序决定）\n 103          primary_intent = matched_intents[0]\n 104          suggested_tools = self.INTENT_TO_TOOLS.get(primary_intent, [])\n 105  \n 106          return Intent(\n 107              name=primary_intent,\n 108              confidence=1.0 if len(matched_intents) == 1 else 0.8,\n 109              suggested_tools=suggested_tools,\n 110              reasoning=f\"规则匹配到意图: {primary_intent}\"\n 111          )\n 112  ","truncated":true},"apps/api/app/agent/agent_loop.py#_tool_args":{"path":"apps/api/app/agent/agent_loop.py","symbol":"_tool_args","line":250,"end":256,"sha":"454b52280d212a4a091b253b2281b13ac94ba4962e95a2fd0649abfe69e5830e","snippet":" 250      def _tool_args(tool_name: str, entities: dict) -> dict:\n 251          args = {}\n 252          if tool_name in {\"get_score_trend\", \"get_subject_scores\", \"get_question_losses\", \"get_diagnosis\", \"get_rank_change\"} and entities.get(\"subject_name\"):\n 253              args['subject_name'] = entities['subject_name']\n 254          if entities.get('exam_id'):\n 255              args['current_exam_id' if tool_name == 'get_rank_change' else 'exam_id'] = entities['exam_id']\n 256          return args","truncated":false},"apps/api/app/services/curriculum.py#publish_draft":{"path":"apps/api/app/services/curriculum.py","symbol":"publish_draft","line":760,"end":807,"sha":"5a3a16c20058a450c138ad66ac57eef846b02552d812a9fa0ae95a2a7226870c","snippet":" 760  async def publish_draft(db, actor, version_id, body, key):\n 761      paper, draft = await draft_detail(db, actor, version_id, lock=True)\n 762      native_only(paper)\n 763      if draft.published_revision == body.expected_revision:\n 764          return data(draft, \"id\", \"revision\", \"published_revision\", \"published_ids\")\n 765      if draft.revision != body.expected_revision or draft.published_revision is not None:\n 766          raise ApiError(409, \"VERSION_CONFLICT\", \"草稿已更新或发布，请刷新核对。\")\n 767      if not draft.entries or any(not entry[\"stem\"].strip() for entry in draft.entries):\n 768          raise ApiError(422, \"DRAFT_INCOMPLETE\", \"每道题必须有人工确认的题干，空草稿不能发布。\")\n 769      _, fresh = await claim(\n 770          db, actor, f\"draft.publish.{draft.id}\", key, body.model_dump()\n 771      )\n 772      if fresh:\n 773          created = {}\n 774          for entry in draft.entries:\n 775              identifier = uuid4()\n 776              body_question = QuestionCreate(\n 777                  subject_id=paper.subject_id,\n 778                  kind=entry[\"kind\"],\n 779                  title=entry[\"title\"],\n 780                  parent_id=created.get(entry.get(\"parent_key\")),\n 781                  stem=entry[\"stem\"],\n 782                  options=entry.get(\"options\", []),\n 783                  answer=entry[\"answer\"],\n 784                  explanation=entry[\"explanation\"],\n 785                  paper_version_id=version_id,\n 786                  regions=entry[\"regions\"],\n 787                  tag_ids=entry.get(\"tag_ids\", []),\n 788              )\n 789              await validate_question(db, actor, body_question)\n 790              question = Question(\n 791                  id=identifier,\n 792                  school_id=actor.school_id,\n 793                  subject_id=paper.subject_id,\n 794                  kind=entry[\"kind\"],\n 795                  parent_id=body_question.parent_id,\n 796                  title=entry[\"title\"],\n 797                  status=\"published\",\n 798              )\n 799              db.add(question)\n 800              await db.flush()\n 801              await add_version(db, actor, question, body_question, published=True)\n 802              created[entry[\"key\"]] = identifier\n 803          draft.published_revision = draft.revision\n 804          draft.published_ids = [str(v) for v in created.values()]\n 805          audit(db, actor, \"draft.publish\", draft, {\"count\": len(created)})\n 806          await db.commit()\n 807      return data(draft, \"id\", \"revision\", \"published_revision\", \"published_ids\")","truncated":false},"apps/api/app/services/school_workbench.py#link_score":{"path":"apps/api/app/services/school_workbench.py","symbol":"link_score","line":358,"end":374,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 358  async def link_score(db, actor, identifier, body):\n 359      score = await owned(db, QuestionScore, identifier, actor, lock=True)\n 360      version = await owned(db, QuestionVersion, body.question_version_id, actor)\n 361      question = await owned(db, Question, version.question_id, actor)\n 362      if (\n 363          not version.published_at\n 364          or question.deleted_at\n 365          or question.subject_id != score.subject_id\n 366      ):\n 367          raise ApiError(422, \"QUESTION_VERSION_INVALID\", \"只能关联同学科的正式题目版本。\")\n 368      if score.question_version_id and score.question_version_id != version.id:\n 369          raise ApiError(409, \"SCORE_ALREADY_LINKED\", \"得分依据已固定，不能覆盖历史题目版本。\")\n 370      if score.question_version_id != version.id:\n 371          score.question_version_id, score.question_id = version.id, question.id\n 372          audit(db, actor, \"score.link\", score, {\"question_version_id\": str(version.id)})\n 373          await db.commit()\n 374      return data(score, \"id\", \"question_id\", \"question_version_id\")","truncated":false},"apps/api/app/services/learning_workbench.py#question_facts":{"path":"apps/api/app/services/learning_workbench.py","symbol":"question_facts","line":37,"end":98,"sha":"faa9e24209bc1bcce18e4478cff1212fcf0445bb514f0f947ece15cfbcda20ee","snippet":"  37  async def question_facts(db, actor, score_id):\n  38      score = await student_owned(db, QuestionScore, score_id, actor)\n  39      question = None\n  40      if score.question_version_id:\n  41          version = await owned(db, QuestionVersion, score.question_version_id, actor)\n  42          item = await owned(db, Question, version.question_id, actor)\n  43          if version.published_at:\n  44              question = {\n  45                  **data(\n  46                      version,\n  47                      \"id\",\n  48                      \"number\",\n  49                      \"stem\",\n  50                      \"options\",\n  51                      \"answer\",\n  52                      \"explanation\",\n  53                      \"paper_version_id\",\n  54                      \"regions\",\n  55                      \"source_id\",\n  56                  ),\n  57                  \"title\": item.title,\n  58                  \"kind\": item.kind,\n  59                  \"parents\": [],\n  60              }\n  61              parent_id = item.parent_id\n  62              # Parent content is only shown from published versions; source date pins it.\n  63              while parent_id:\n  64                  parent = await owned(db, Question, parent_id, actor)\n  65                  parent_version = await db.scalar(\n  66                      select(QuestionVersion)\n  67                      .where(\n  68                          QuestionVersion.question_id == parent_id,\n  69                          QuestionVersion.published_at.is_not(None),\n  70                          QuestionVersion.created_at \u003c= version.created_at,\n  71                      )\n  72                      .order_by(QuestionVersion.number.desc())\n  73                      .limit(1)\n  74                  )\n  75                  if parent_version:\n  76                      question[\"parents\"].insert(\n  77                          0,\n  78                          {\n  79                              \"title\": parent.title,\n  80                              \"stem\": parent_version.stem,\n  81                              \"version\": parent_version.number,\n  82                          },\n  83                      )\n  84                  parent_id = parent.parent_id\n  85      exam = await owned(db, Exam, score.exam_id, actor)\n  86      subject = await owned(db, Subject, score.subject_id, actor)\n  87      return {\n  88          \"score\": {\n  89              **data(score, \"id\", \"question_no\", \"question_version_id\"),\n  90              \"score\": float(score.score),\n  91              \"full_score\": float(score.full_score),\n  92              \"lost_score\": float(score.lost_score),\n  93              \"exam\": exam.name,\n  94              \"subject\": subject.name,\n  95          },\n  96          \"question\": question,\n  97          \"missing_reason\": None if question else \"尚未关联经确认的正式题目版本，请联系学校补全来源；得分事实仍可查看。\",\n  98      }","truncated":false},"apps/api/app/services/legacy_snapshot.py#ingest":{"path":"apps/api/app/services/legacy_snapshot.py","symbol":"ingest","line":58,"end":440,"sha":"e4667a04ee5cf6f3c36ffd78ff9cbe23dff611eca7f14e9a8394718b90a17953","snippet":"  58  async def ingest(db, actor, body):\n  59      if body.captured_at.tzinfo is None:\n  60          raise ApiError(422, \"SOURCE_TIME_REQUIRED\", \"来源水位须包含时区。\")\n  61      await db.scalar(\n  62          select(School).where(School.id == actor.school_id).with_for_update()\n  63      )\n  64      seen, items = set(), []\n  65      # Dependencies are deliberate: exams, papers, parent-first questions, reports, scores.\n  66      order = {\"exam\": 0, \"paper\": 1, \"question\": 2, \"report\": 3, \"score\": 4}\n  67      for entry in sorted(body.records, key=lambda r: order[r.entity_type]):\n  68          pair = (entry.entity_type, entry.external_id)\n  69          if pair in seen:\n  70              raise ApiError(422, \"DUPLICATE_SOURCE_ID\", \"同批次实体来源 ID 重复。\")\n  71          seen.add(pair)\n  72          payload = entry.model_dump(mode=\"json\")\n  73          content_hash = digest(payload)\n  74          old = await db.scalar(\n  75              select(SourceRecord).where(\n  76                  SourceRecord.school_id == actor.school_id,\n  77                  SourceRecord.source_system == body.source_system,\n  78                  SourceRecord.entity_type == entry.entity_type,\n  79                  SourceRecord.external_id == entry.external_id,\n  80                  SourceRecord.source_version == body.source_version,\n  81              )\n  82          )\n  83          if old:\n  84              if old.content_hash != content_hash:\n  85                  raise ApiError(\n  86                      409, \"SOURCE_VERSION_CONFLICT\", \"相同来源版本的内容发生变化，请使用新的来源版本。\"\n  87                  )\n  88              items.append(\n  89                  {\n  90                      **data(\n  91                          old,\n  92                          \"id\",\n  93                          \"entity_type\",\n  94                          \"external_id\",\n  95                          \"native_id\",\n  96                          \"source_version\",\n  97                          \"content_hash\",\n  98                      ),\n  99                      \"replayed\": True,\n 100                  }\n 101              )\n 102              continue\n 103          previous = await db.scalar(\n 104              select(SourceRecord)\n 105              .where(\n 106                  SourceRecord.school_id == actor.school_id,\n 107                  SourceRecord.source_system == body.source_system,\n 108                  SourceRecord.entity_type == entry.entity_type,\n 109                  SourceRecord.external_id == entry.external_id,\n 110              )\n 111              .order_by(SourceRecord.created_at.desc())\n 112              .limit(1)\n 113          )\n 114          if (\n 115              previous\n 116              and (\n 117                  previous.captured_at\n 118                  if previous.captured_at.tzinfo\n 119                  else previous.captured_at.replace(tzinfo=timezone.utc)\n 120              )\n 121              > body.captured_at\n 122          ):\n 123              raise ApiError(409, \"SOURCE_WATERMARK_REGRESSION\", \"来源水位不能早于已有版本。\")\n 124          identifier = (\n 125              previous.native_id\n 126              if previous and entry.entity_type != \"report\"\n 127              else uuid4()\n 128          )\n 129          source = SourceRecord(\n 130              id=uuid4(),\n 131              school_id=actor.school_id,\n 132              source_system=body.source_system,\n 133              entity_type=entry.entity_type,\n 134              external_id=entry.external_id,\n 135              source_version=body.source_version,\n 136              content_hash=content_hash,\n 137              captured_at=body.captured_at,\n 138              native_id=identifier,\n 139              payload=payload,\n 140          )\n 141          db.add(source)\n 142          await db.flush()\n 143          if entry.entity_type == \"exam\":\n 144              item = (\n 145                  await db.get(Exam, identifier)\n 146                  if previous\n 147                  else Exam(\n 148                      id=identifier,\n 149                      school_id=actor.school_id,\n 150                      external_exam_id=f\"legacy-{digest([body.source_system,entry.external_id])}\",\n 151                      source_system=body.source_system,\n 152                  )\n 153              )","truncated":true},"apps/api/app/schemas/legacy_snapshot.py#Snapshot":{"path":"apps/api/app/schemas/legacy_snapshot.py","symbol":"Snapshot","line":72,"end":83,"sha":"ce3c4eea68b3766a0c47a686fea2028cbce6ade6d558ce47e68059895be3522d","snippet":"  72  class Snapshot(Payload):\n  73      source_system: str = Field(min_length=1, max_length=50, pattern=r\"^[a-zA-Z0-9_-]+$\")\n  74      source_version: str = Field(min_length=1, max_length=20)\n  75      captured_at: datetime\n  76      records: list[Record] = Field(min_length=1, max_length=500)\n  77  \n  78      @field_validator(\"source_system\")\n  79      @classmethod\n  80      def external_source(cls, value):\n  81          if value == \"native\":\n  82              raise ValueError(\"外部快照不能使用 native 来源\")\n  83          return value","truncated":false},"apps/api/app/services/learning_workbench.py#add_review":{"path":"apps/api/app/services/learning_workbench.py","symbol":"add_review","line":101,"end":129,"sha":"faa9e24209bc1bcce18e4478cff1212fcf0445bb514f0f947ece15cfbcda20ee","snippet":" 101  async def add_review(db, actor, body, key):\n 102      score = await owned(db, QuestionScore, body.score_id, actor, lock=True)\n 103      if score.student_id != actor.student_id:\n 104          raise ApiError(404, \"RESOURCE_NOT_AVAILABLE\", \"记录不属于当前学生。\")\n 105      if not score.question_version_id:\n 106          raise ApiError(409, \"QUESTION_SOURCE_REQUIRED\", \"该成绩尚未关联原题，暂不能加入复盘。\")\n 107      await question_facts(db, actor, score.id)\n 108      existing = await db.scalar(\n 109          select(ReviewEntry).where(\n 110              ReviewEntry.student_id == actor.student_id, ReviewEntry.score_id == score.id\n 111          )\n 112      )\n 113      if existing:\n 114          return await review_detail(db, actor, existing.id)\n 115      identifier, fresh = await claim(\n 116          db, actor, \"review.create\", key, body.model_dump(mode=\"json\")\n 117      )\n 118      if fresh:\n 119          item = ReviewEntry(\n 120              id=identifier,\n 121              school_id=actor.school_id,\n 122              student_id=actor.student_id,\n 123              score_id=score.id,\n 124              question_version_id=score.question_version_id,\n 125          )\n 126          db.add(item)\n 127          audit(db, actor, \"review.create\", item)\n 128          await db.commit()\n 129      return await review_detail(db, actor, identifier)","truncated":false},"apps/api/app/services/learning_workbench.py#add_review_record":{"path":"apps/api/app/services/learning_workbench.py","symbol":"add_review_record","line":156,"end":173,"sha":"faa9e24209bc1bcce18e4478cff1212fcf0445bb514f0f947ece15cfbcda20ee","snippet":" 156  async def add_review_record(db, actor, identifier, body, key):\n 157      await student_owned(db, ReviewEntry, identifier, actor)\n 158      if body.next_review_at and body.next_review_at.tzinfo is None:\n 159          raise ApiError(422, \"TIMEZONE_REQUIRED\", \"复习时间须包含时区。\")\n 160      record_id, fresh = await claim(\n 161          db, actor, f\"review.record.{identifier}\", key, body.model_dump(mode=\"json\")\n 162      )\n 163      if fresh:\n 164          item = ReviewRecord(\n 165              id=record_id,\n 166              school_id=actor.school_id,\n 167              review_id=identifier,\n 168              **body.model_dump(),\n 169          )\n 170          db.add(item)\n 171          audit(db, actor, \"review.record\", item)\n 172          await db.commit()\n 173      return await review_detail(db, actor, identifier)","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#submit_feedback":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"submit_feedback","line":652,"end":713,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 652  async def submit_feedback(\n 653      message_id: UUID,\n 654      data: FeedbackRequest,\n 655      idempotency_key: UUID | None = Header(None, alias='Idempotency-Key'),\n 656      current_user: AuthenticatedStudent = Depends(get_current_student),\n 657      db: AsyncSession = Depends(get_db),\n 658  ):\n 659      result = await db.execute(\n 660          select(ChatMessage)\n 661          .join(ChatSession, ChatSession.id == ChatMessage.session_id)\n 662          .where(\n 663              ChatMessage.id == message_id,\n 664              ChatMessage.role == 'assistant',\n 665              ChatSession.school_id == current_user.school_id,\n 666              ChatSession.student_id == current_user.student_id,\n 667          ).with_for_update(of=ChatMessage)\n 668      )\n 669      message = result.scalar_one_or_none()\n 670      if not message:\n 671          raise HTTPException(\n 672              status_code=status.HTTP_404_NOT_FOUND,\n 673              detail=\"消息不存在或无权访问\",\n 674              headers={\"X-Error-Code\": \"MESSAGE_NOT_FOUND\"},\n 675          )\n 676      existing = await db.scalar(select(PlatformFeedback).where(PlatformFeedback.message_id == message_id,\n 677          PlatformFeedback.user_id == current_user.user_id, PlatformFeedback.school_id == current_user.school_id).order_by(PlatformFeedback.created_at).limit(1))\n 678      if existing:\n 679          if existing.rating != data.rating or existing.note != data.note:\n 680              raise ApiError(409, 'MESSAGE_FEEDBACK_EXISTS', '这条回答已有反馈，请在支持中心查看处理进度。')\n 681          return {'accepted': True, 'id': str(existing.id)}\n 682      identifier, fresh = await claim(db, current_user, 'message.feedback', idempotency_key,\n 683                                      {'message_id': str(message_id), **data.model_dump()})\n 684      if not fresh:\n 685          return {'accepted': True, 'id': str(identifier)}\n 686      db.add(\n 687          AuditLog(\n 688              action=\"message_feedback\",\n 689              actor_type=\"student\",\n 690              actor_id=current_user.user_id,\n 691              resource_type=\"chat_message\",\n 692              resource_id=message_id,\n 693              allowed=True,\n 694              reason=data.rating,\n 695              extra_data={\"note\": data.note} if data.note else None,\n 696          )\n 697      )\n 698      # Keep the original audit record for traceability and create an actionable\n 699      # operations item so school/city teams can triage feedback in one queue.\n 700      db.add(\n 701          PlatformFeedback(\n 702              id=identifier,\n 703              school_id=current_user.school_id,\n 704              user_id=current_user.user_id,\n 705              student_id=current_user.student_id,\n 706              message_id=message_id,\n 707              rating=data.rating,\n 708              category=\"回答质量\",\n 709              note=data.note,\n 710          )\n 711      )\n 712      await db.commit()\n 713      return {\"accepted\": True, \"id\": str(identifier)}","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#create_student_handoff":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"create_student_handoff","line":473,"end":488,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 473  async def create_student_handoff(\n 474      data: HandoffCreate,\n 475      idempotency_key: UUID | None = Header(default=None),\n 476      current: AuthenticatedStudent = Depends(get_current_student),\n 477      db: AsyncSession = Depends(get_db),\n 478  ):\n 479      if data.session_id:\n 480          session = await db.scalar(select(ChatSession).where(\n 481              ChatSession.id == data.session_id, ChatSession.school_id == current.school_id,\n 482              ChatSession.student_id == current.student_id, ChatSession.status == \"active\",\n 483          ))\n 484          if session is None:\n 485              raise ApiError(404, \"SESSION_NOT_FOUND\", \"会话不存在或无权关联\")\n 486      item = await create_once(db, current, \"handoff\", data.model_dump(), idempotency_key, HumanHandoff,\n 487                              dict(school_id=current.school_id, student_id=current.student_id, **data.model_dump()))\n 488      return _handoff_out(item)","truncated":false},"apps/api/app/core/platform_workflows.py#transition_workflow":{"path":"apps/api/app/core/platform_workflows.py","symbol":"transition_workflow","line":100,"end":133,"sha":"a0c398a22732f25108d8b10b483e176097ad40ed2813c9eb0387f6cc72130917","snippet":" 100  async def transition_workflow(\n 101      db: AsyncSession, item: RiskEvent | PlatformFeedback | HumanHandoff,\n 102      current, kind: str, target: str, resolution: str | None = None,\n 103      expected_version: int | None = None,\n 104  ):\n 105      transitions = WORKFLOW_TRANSITIONS[kind]\n 106      note = resolution.strip() if resolution else None\n 107      if target not in transitions:\n 108          await _reject(db, item, current, kind, \"transition\", \"WORKFLOW_STATUS_INVALID\", \"不支持的工作流状态\", target=target, status_code=422)\n 109      # Retried requests do not change assignee/timestamps or duplicate audit.\n 110      if target == item.status:\n 111          if note is None or note == item.resolution:\n 112              return item\n 113          await _reject(db, item, current, kind, \"transition\", \"WORKFLOW_CONFLICT\", \"状态已完成，不能用重复提交覆盖处理说明\", target=target)\n 114      if expected_version is not None and expected_version != item.state_version:\n 115          await _reject(db, item, current, kind, \"transition\", \"WORKFLOW_CONFLICT\", \"记录已更新，请刷新后重试\", target=target)\n 116      if target not in transitions.get(item.status, set()):\n 117          await _reject(db, item, current, kind, \"transition\", \"WORKFLOW_TRANSITION_NOT_ALLOWED\", \"当前状态不允许此操作，请刷新后按流程处理\", target=target)\n 118      if (target in {\"resolved\", \"closed\"} or item.status in {\"resolved\", \"closed\"}) and not note:\n 119          await _reject(db, item, current, kind, \"transition\", \"WORKFLOW_REASON_REQUIRED\", \"解决、关闭或重新打开必须填写真实处理说明\", target=target, status_code=422)\n 120      now = datetime.now(timezone.utc)\n 121      values: dict[str, Any] = {\n 122          \"status\": target,\n 123          \"resolution\": note,\n 124          \"resolved_at\": now if target in {\"resolved\", \"closed\"} else None,\n 125          \"assignee_id\" if kind == \"feedback\" else \"assigned_to\": current.user_id,\n 126      }\n 127      if kind == \"handoff\":\n 128          if target == \"accepted\":\n 129              values[\"accepted_at\"] = now\n 130          elif target == \"open\":\n 131              values[\"accepted_at\"] = None\n 132              values[\"assigned_to\"] = None\n 133      return await _persist(db, item, current, kind, \"transition\", values, note)","truncated":false},"apps/api/app/services/learning_workbench.py#handoff_reply":{"path":"apps/api/app/services/learning_workbench.py","symbol":"handoff_reply","line":377,"end":406,"sha":"faa9e24209bc1bcce18e4478cff1212fcf0445bb514f0f947ece15cfbcda20ee","snippet":" 377  async def handoff_reply(db, actor, identifier, body, key):\n 378      item, manager = await handoff_access(db, actor, identifier, lock=True)\n 379      # A replay remains readable after closing; new messages require an open case.\n 380      message_id, fresh = await claim(\n 381          db, actor, f\"handoff.reply.{identifier}\", key, body.model_dump()\n 382      )\n 383      if fresh:\n 384          if item.status not in {\"open\", \"accepted\"}:\n 385              raise ApiError(409, \"HANDOFF_CLOSED\", \"工单已结束，请先填写原因重新打开 hashlib.sha256(\n  22          json.dumps(\n  23              payload,\n  24              sort_keys=True,\n  25              ensure_ascii=False,\n  26              default=str,\n  27              separators=(\",\", \":\"),\n  28          ).encode()\n  29      ).hexdigest()\n  30  \n  31  \n  32  def data(row, *fields):\n  33      result = {}\n  34      for name in fields:\n  35          value = getattr(row, name)\n  36          result[name] = (\n  37              value.isoformat()\n  38              if hasattr(value, \"isoformat\")\n  39              else str(value)\n  40              if hasattr(value, \"hex\")\n  41              else value\n  42          )\n  43      return result\n  44  \n  45  \n  46  async def owned(db, model, identifier, actor, *, lock=False):\n  47      query = select(model).where(\n  48          model.id == identifier, model.school_id == actor.school_id\n  49      )\n  50      if lock:\n  51          query = query.with_for_update()\n  52      item = await db.scalar(query.execution_options(populate_existing=True))\n  53      if item is None:\n  54          raise ApiError(404, \"RESOURCE_NOT_AVAILABLE\", \"记录不存在或不在授权范围内。\")\n  55      return item\n  56  \n  57  \n  58  async def subject_access(db, actor, subject_id):\n  59      if is_teacher_only(actor) and not await db.scalar(\n  60          select(TeachingAssignment.id)\n  61          .where(*active_grants(actor), TeachingAssignment.subject_id == subject_id)\n  62          .limit(1)\n  63      ):\n  64          raise ApiError(404, \"RESOURCE_NOT_AVAILABLE\", \"记录不存在或不在任教学科范围内。\")\n  65  \n  66  \n  67  def native_only(item):\n  68      if getattr(item, \"source_system\", \"native\") != \"native\":\n  69          raise ApiError(409, \"EXTERNAL_READ_ONLY\", \"该记录由外部系统维护，只能接收新来源版本。\")\n  70  \n  71  \n  72  def audit(db, actor, action, item, extra=None):","truncated":false},"apps/api/app/api/v1/endpoints/education.py#write":{"path":"apps/api/app/api/v1/endpoints/education.py","symbol":"write","l urn \"\"\"\n 167  对比两次考试的排名变化，包括总分排名和各科排名的变化。\n 168  如果不指定两次考试ID，则对比最近两次考试。\n 169  \"\"\"\n 170  \n 171      @property\n 172      def input_schema(self) -> dict:\n 173          return {\n 174              \"type\": \"object\",\n 175              \"properties\": {\n 176                  \"current_exam_id\": {\n 177                      \"type\": \"string\",\n 178                      \"description\": \"当前考试ID，可选\"\n 179                  },\n 180                  \"previous_exam_id\": {\n 181                      \"type\": \"string\",\n 182                      \"description\": \"对比考试ID，可选\"\n 183                  }\n 184              }\n 185          }\n 186  \n 187      async def execute(\n 188          self,\n 189          tool_context: ToolContext,\n 190          args: dict\n 191      ) -> ToolResult:\n 192          \"\"\"执行Tool\"\"\"\n 193          current_exam_id_str = args.get(\"current_exam_id\")\n 194          previous_exam_id_str = args.get(\"previous_exam_id\")\n 195  \n 196          try:\n 197              # 确定两次考试ID；选择旧考试时比较它之前的考试，不回退到最新考试。\n 198              if current_exam_id_str and not previous_exam_id_str:\n 199                  current_exam = await self.db.scalar(select(Exam).join(StudentExamScore, StudentExamScore.exam_id == Exam.id).where(\n 200                      Exam.id == UUID(current_exam_id_str), Exam.school_id == tool_context.school_id,\n 201                      StudentExamScore.student_id == tool_context.student_id, StudentExamScore.school_id == tool_context.school_id))\n 202                  if current_exam is None:\n 203                      return ToolResult(ok=False, data={}, error_code='EXAM_NOT_AVAILABLE')\n 204                  previous = await self.db.scalar(select(Exam).join(StudentExamScore, StudentExamScore.exam_id == Exam.id).where(\n 205                      Exam.school_id == tool_context.school_id, StudentExamScore.school_id == tool_context.school_id,\n 206                      StudentExamScore.student_id == tool_context.student_id, Exam.id != current_exam.id,\n 207                      Exam.start_date \u003c current_exam.start_date if current_exam.start_date else Exam.created_at \u003c current_exam.created_at,\n 208                  ).order_by(Exam.start_date.desc(), Exam.created_at.desc()).limit(1))\n 209                  if previous is None:\n 210                      return ToolResult(ok=False, data={}, error_code='INSUFFICIENT_EXAMS')\n 211                  previous_exam_id_str = str(previous.id)\n 212              if current_exam_id_str and previous_exam_id_str:\n 213                  current_exam_id = UUID(current_exam_id_str)\n 214                  previous_exam_id = UUID(previous_exam_id_str)\n 215              else:\n 216                  # 获取最近两次考试\n 217                  scores_result = await self.db.execute(\n 218                      select(StudentExamScore)\n 219                      .where(\n 220                          StudentExamScore.student_id == tool_context.student_id,\n 221                          StudentExamScore.school_id == tool_context.school_id\n 222                      )\n 223                      .order_by(StudentExamScore.created_at.desc())\n 224                      .limit(2)\n 225                  )\n 226                  scores = scores_result.scalars().all()\n 227                  if len(scores) \u003c 2:\n 228                      return ToolResult(\n 229                          ok=False,\n 230                          error_code=\"INSUFFICIENT_EXAMS\",\n 231                          error_message=\"需要至少两次考试记录才能对比\",\n 232                          data={}\n 233                      )\n 234                  current_exam_id = scores[0].exam_id\n 235                  previous_exam_id = scores[1].exam_id\n 236  \n 237              # 查询两次考试的总分成绩\n 238              current_score_result = await self.db.execute(\n 239                  select(StudentExamScore).where(\n 240                      StudentExamScore.student_id == tool_context.student_id,\n 241                      StudentExamScore.school_id == tool_context.school_id,\n 242                      StudentExamScore.exam_id == current_exam_id\n 243                  )\n 244              )\n 245              current_score = current_score_result.scalar_one_or_none()\n 246  \n 247              previous_score_result = await self.db.execute(\n 248                  select(StudentExamScore).where(\n 249                      StudentExamScore.student_id == tool_context.student_id,","truncated":true},"apps/api/app/core/access_scope.py#scoped":{"path":"apps/api/app/core/access_scope.py","symbol":"scoped","line":57,"end":74,"sha":"1497f600599bf4b89beb60371e928e3f01a96131f884f905eb98ff00481561c6","snippet":"  57  def scoped(query, user, school_column):\n  58      \"\"\"Apply tenancy and, for teachers, class-level queues/rosters or subject docs.\"\"\"\n  59      if is_city(user):\n  60          return query\n  61      query = query.where(school_column == user.school_id)\n  62      if not is_teacher_only(user):\n  63          return query\n  64      table = school_column.table\n  65      if table.name == \"students\":\n  66          return query.where(table.c.id.in_(student_ids(user)))\n  67      if \"student_id\" in table.c:\n  68          return query.where(table.c.student_id.in_(student_ids(user)))\n  69      if table.name == \"knowledge_documents\":\n  70          return query.where(table.c.subject.in_(\n  71              select(Subject.name).join(TeachingAssignment, TeachingAssignment.subject_id == Subject.id)\n  72              .where(*active_grants(user), Subject.school_id == user.school_id)\n  73          ), table.c.status == \"published\")\n  74      return query","truncated":false},"apps/api/app/api/v1/endpoints/education.py":{"path":"apps/api/app/api/v1/endpoints/education.py","symbol":null,"line":1,"end":72,"sha":"c0ff8cbf2a42f57bd60a8bbb0db430fedacfddcfe4659102fe68801772e2fafe","snippet":"   1  \"\"\"Education workbench API. All mutations are school-admin capabili t\",\n 294          student_id=str(current_user.student_id),\n 295          school_id=str(current_user.school_id),\n 296          title=data.title if data else None,\n 297      )\n 298      session = ChatSession(\n 299          school_id=current_user.school_id,\n 300          student_id=current_user.student_id,\n 301          title=(data.title if data else None),\n 302          status=\"active\",\n 303      )\n 304      db.add(session)\n 305      await db.commit()\n 306      await db.refresh(session)\n 307      logger.info(\n 308          \"chat_session_created\",\n 309          session_id=str(session.id),\n 310          student_id=str(current_user.student_id),\n 311      )\n 312      return SessionOut(\n 313          id=str(session.id),\n 314          title=session.title,\n 315          status=session.status,\n 316          created_at=session.created_at.isoformat(),\n 317          updated_at=session.updated_at.isoformat(),\n 318          message_count=0,\n 319      )","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#list_sessions":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"list_sessions","line":323,"end":349,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 323  async def list_sessions(\n 324      current_user: AuthenticatedStudent = Depends(get_current_student),\n 325      db: AsyncSession = Depends(get_db),\n 326  ):\n 327      result = await db.execute(\n 328          select(ChatSession, func.count(ChatMessage.id))\n 329          .outerjoin(ChatMessage, ChatMessage.session_id == ChatSession.id)\n 330          .where(\n 331              ChatSession.school_id == current_user.school_id,\n 332              ChatSession.student_id == current_user.student_id,\n 333              ChatSession.status == \"active\",\n 334          )\n 335          .group_by(ChatSession.id)\n 336          .order_by(ChatSession.updated_at.desc())\n 337          .limit(50)\n 338      )\n 339      return [\n 340          SessionOut(\n 341              id=str(session.id),\n 342              title=session.title,\n 343              status=session.status,\n 344              created_at=session.created_at.isoformat(),\n 345              updated_at=session.updated_at.isoformat(),\n 346              message_count=int(count),\n 347          )\n 348          for session, count in result.all()\n 349      ]","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#send_message":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"send_message","line":427,"end":482,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 427  async def send_message(\n 428      session_id: UUID,\n 429      data: MessageCreateRequest,\n 430      request: Request,\n 431      current_user: AuthenticatedStudent = Depends(get_current_student),\n 432      db: AsyncSession = Depends(get_db),\n 433  ):\n 434      session = await _get_session(session_id, current_user, db)\n 435      existing = await _find_idempotent_reply(session, data, db)\n 436      if existing is not None:\n 437          return _message_response(session, existing)\n 438      user_message, created = await _save_user_message(session, data, db)\n 439      if not created:\n 440          raise ApiError(status.HTTP_409_CONFLICT, \"MESSAGE_IN_PROGRESS\", \"消息正在处理中，请稍后重试\")\n 441      history = await _history(session.id, db)\n 442      try:\n 443          result = await _run_agent(request, current_user, db, data.content, session, history)\n 444      except Exception:\n 445          # The user row was committed before the model call. Remove an\n 446          # unassociated row so a retry with the same client_message_id is\n 447          # allowed after a failed run.\n 448          await db.rollback()\n 449          await db.execute(\n 450              ChatMessage.__table__.delete().where(ChatMessage.id == user_message.id)\n 451          )\n 452          await db.commit()\n 453          raise\n 454      user_message.agent_run_id = UUID(result.agent_run_id)\n 455  \n 456      assistant = ChatMessage(\n 457          session_id=session.id,\n 458          role=\"assistant\",\n 459          content=result.final_answer,\n 460          agent_run_id=UUID(result.agent_run_id),\n 461          sources=getattr(result, 'sources', []),\n 462          selected_context=user_message.selected_context,\n 463      )\n 464      session.last_message_at = datetime.now(timezone.utc)\n 465      db.add(assistant)\n 466      await db.commit()\n 467      await db.refresh(assistant)\n 468      sources = getattr(result, \"sources\", [])\n 469      return MessageResponse(\n 470          session_id=str(session.id),\n 471          message=ChatMessageOut(\n 472              id=str(assistant.id),\n 473              role=\"assistant\",\n 474              content=assistant.content,\n 475              created_at=assistant.created_at.isoformat(),\n 476              sources=sources,\n 477              agent_run_id=result.agent_run_id,\n 478          ),\n 479          agent_run_id=result.agent_run_id,\n 480          tools_called=result.total_tools_called,\n 481          sources=sources,\n 482      )","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#read_message_feedback":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"read_message_feedback","line":717,"end":725,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 717  async def read_message_feedback(message_id: UUID, current_user: AuthenticatedStudent = Depends(get_current_student), db: AsyncSession = Depends(get_db)):\n 718      message = await db.scalar(select(ChatMessage.id).join(ChatSession, ChatSession.id == ChatMessage.session_id).where(\n 719          ChatMessage.id == message_id, ChatMessage.role == 'assistant', ChatSession.school_id == current_user.school_id,\n 720          ChatSession.student_id == current_user.student_id))\n 721      if message is None:\n 722          raise ApiError(404, 'MESSAGE_NOT_FOUND', '回答不存在或无权访问。')\n 723      feedback = await db.scalar(select(PlatformFeedback).where(PlatformFeedback.school_id == current_user.school_id,\n 724          PlatformFeedback.user_id == current_user.user_id, PlatformFeedback.message_id == message_id).order_by(PlatformFeedback.created_at).limit(1))\n 725      return {'feedback': {'id': str(feedback.id), 'rating': feedback.rating, 'status': feedback.status} if feedback else None}","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_dashboard":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_dashboard","line":154,"end":249,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 154  async def student_dashboard(\n 155      current: AuthenticatedStudent = Depends(get_current_student),\n 156      db: AsyncSession = Depends(get_db),\n 157  ):\n 158      logger.info(\n 159          \"student_dashboard_request\",\n 160          student_id=str(current.student_id),\n 161          school_id=str(current.school_id),\n 162      )\n 163      scores_result = await db.execute(\n 164          select(StudentExamScore, Exam)\n 165          .join(Exam, Exam.id == StudentExamScore.exam_id)\n 166          .where(StudentExamScore.school_id == current.school_id, StudentExamScore.student_id == current.student_id)\n 167          .order_by(Exam.start_date.desc().nullslast(), Exam.created_at.desc(), Exam.id.desc())\n 168          .limit(2)\n 169      )\n 170      scores = scores_result.all()\n 171      latest = scores[0] if scores else None\n 172      previous = scores[1] if len(scores) > 1 else None\n 173      # The query above only fetches the latest two scores for the delta, not the total\n 174      # number of exams. Count the full history separately.\n 175      exam_total = await db.scalar(\n 176          select(func.count(StudentExamScore.id)).where(\n 177              StudentExamScore.school_id == current.school_id,\n 178              StudentExamScore.student_id == current.student_id,\n 179          )\n 180      )\n 181      subjects: list[dict[str, Any]] = []\n 182      if latest:\n 183          subjects_result = await db.execute(\n 184              select(StudentSubjectScore, Subject)\n 185              .join(Subject, Subject.id == StudentSubjectScore.subject_id)\n 186              .where(\n 187                  StudentSubjectScore.school_id == current.school_id,\n 188                  StudentSubjectScore.student_id == current.student_id,\n 189                  StudentSubjectScore.exam_id == latest[0].exam_id,\n 190              )\n 191          )\n 192          subjects = [\n 193              {\n 194                  \"name\": subject.name,\n 195                  \"score\": float(item.score),\n 196                  \"full_score\": _full_score(item.full_score),\n 197                  \"percentage\": _percentage(item.score, item.full_score),\n 198                  \"class_rank\": item.class_rank,\n 199                  \"grade_rank\": item.grade_rank,\n 200              }\n 201              for item, subject in subjects_result.all()\n 202          ]\n 203          # 首页文案承诺按得分率排序；未知得分率排在最后。\n 204          subjects.sort(key=lambda subject: (subject[\"percentage\"] is None, -(subject[\"percentage\"] or 0)))\n 205      diagnosis_count = await db.scalar(select(func.count()).select_from(authorized_reports(current.school_id, current.student_id).subquery()))\n 206      open_risks = await db.scalar(\n 207          select(func.count(RiskEvent.id)).where(\n 208              RiskEvent.school_id == current.school_id,\n 209              RiskEvent.student_id == current.student_id,\n 210              RiskEvent.status.in_([\"open\", \"acknowledged\"]),\n 211          )\n 212      )\n 213      open_handoffs = await db.scalar(\n 214          select(func.count(HumanHandoff.id)).where(\n 215              HumanHandoff.school_id == current.school_id,\n 216              HumanHandoff.student_id == current.student_id,\n 217              HumanHandoff.status.in_([\"open\", \"accepted\"]),\n 218          )\n 219      )\n 220      authorization = await db.scalar(\n 221          select(ParentAuthorization)\n 222          .where(\n 223              ParentAuthorization.school_id == current.school_id,\n 224              ParentAuthorization.student_id == current.student_id,\n 225              ParentAuthorization.status.in_([\"pending\", \"active\"]),\n 226          )\n 227          .order_by(ParentAuthorization.created_at.desc())\n 228          .limit(1)\n 229      )\n 230      latest_score = latest[0] if latest else None\n 231      return {\n 232          \"student\": {\"id\": str(current.student_id), \"name\": current.student_name},\n 233          \"latest_exam\": {\n 234              \"id\": str(latest[1].id),\n 235              \"name\": latest[1].name,\n 236              \"date\": _iso(latest[1].start_date),\n 237              \"total_score\": float(latest_score.total_score),\n 238              \"full_score\": _full_score(latest_score.full_score),\n 239              \"class_rank\": latest_score.class_rank,\n 240              \"grade_rank\": latest_score.grade_rank,\n 241              \"score_delta\": round(float(latest_score.total_score) - float(previous[0].total_score), 1) if previous else None,\n 242          } if latest else None,\n 243          \"subjects\": subjects,\n 244          \"exam_count\": int(exam_total or 0),\n 245          \"diagnosis_count\": int(diagnosis_count or 0),\n 246          \"open_risks\": int(open_risks or 0),\n 247          \"open_handoffs\": int(open_handoffs or 0),\n 248          \"parent_authorization\": _authorization_out(authorization) if authorization else None,\n 249      }","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_trends":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_trends","line":253,"end":289,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 253  async def student_trends(\n 254      current: AuthenticatedStudent = Depends(get_current_student),\n 255      db: AsyncSession = Depends(get_db),\n 256  ):\n 257      result = await db.execute(\n 258          select(StudentExamScore, Exam)\n 259          .join(Exam, Exam.id == StudentExamScore.exam_id)\n 260          .where(StudentExamScore.school_id == current.school_id, StudentExamScore.student_id == current.student_id)\n 261          .order_by(Exam.start_date.desc().nullslast(), Exam.created_at.desc(), Exam.id.desc())\n 262          .limit(20)\n 263      )\n 264      # 先取最近 20 次，再恢复为时间升序，避免第 21 次之后的最新考试被排除。\n 265      exam_rows = list(reversed(result.all()))\n 266      subject_result = await db.execute(\n 267          select(StudentSubjectScore, Subject, Exam)\n 268          .join(Subject, Subject.id == StudentSubjectScore.subject_id)\n 269          .join(Exam, Exam.id == StudentSubjectScore.exam_id)\n 270          .where(\n 271              StudentSubjectScore.school_id == current.school_id,\n 272              StudentSubjectScore.student_id == current.student_id,\n 273              StudentSubjectScore.exam_id.in_([exam.id for _, exam in exam_rows]),\n 274          )\n 275          .order_by(Exam.start_date.asc().nullsfirst(), Exam.created_at.asc(), Exam.id.asc(), Subject.name.asc())\n 276      )\n 277      subject_rows = subject_result.all()\n 278      subject_names = list(dict.fromkeys(subject.name for _, subject, _ in subject_rows))\n 279      return {\n 280          \"exams\": [\n 281              {\"id\": str(exam.id), \"name\": exam.name, \"date\": _iso(exam.start_date), \"score\": float(score.total_score), \"full_score\": _full_score(score.full_score), \"class_rank\": score.class_rank, \"grade_rank\": score.grade_rank}\n 282              for score, exam in exam_rows\n 283          ],\n 284          \"subjects\": [\n 285              {\"subject\": subject.name, \"exam\": exam.name, \"date\": _iso(exam.start_date), \"score\": float(score.score), \"full_score\": _full_score(score.full_score)}\n 286              for score, subject, exam in subject_rows\n 287          ],\n 288          \"subject_names\": subject_names,\n 289      }","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_diagnosis":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_diagnosis","line":293,"end":319,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 293  async def student_diagnosis(\n 294      current: AuthenticatedStudent = Depends(get_current_student),\n 295      db: AsyncSession = Depends(get_db),\n 296  ):\n 297      await require_diagnosis(db, current)\n 298      result = await db.execute(\n 299          authorized_reports(current.school_id, current.student_id).add_columns(Exam)\n 300          .outerjoin(Exam, (Exam.id == DiagnosisReport.exam_id) & (Exam.school_id == current.school_id))\n 301          .order_by(DiagnosisReport.generated_at.desc())\n 302          .limit(20)\n 303      )\n 304      rows = result.all()\n 305      await audit_report_access(db, current, True)\n 306      return [\n 307          {\n 308              \"id\": str(report.id),\n 309              \"type\": report.report_type,\n 310              \"status\": report.status,\n 311              \"version\": report.version,\n 312              \"generated_at\": _iso(report.generated_at),\n 313              \"exam_name\": exam.name if exam else None,\n 314              \"content\": report.structured_json or {},\n 315              \"source\": report.source_system or \"校内成绩系统\",\n 316              \"has_source\": bool(report.raw_content and report.raw_content.strip()),\n 317          }\n 318          for report, exam in rows\n 319      ]","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_mistakes":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_mistakes","line":339,"end":369,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 339  async def student_mistakes(\n 340      subject: str | None = None,\n 341      current: AuthenticatedStudent = Depends(get_current_student),\n 342      db: AsyncSession = Depends(get_db),\n 343  ):\n 344      query = (\n 345          select(QuestionScore, Exam, Subject)\n 346          .join(Exam, Exam.id == QuestionScore.exam_id)\n 347          .join(Subject, Subject.id == QuestionScore.subject_id)\n 348          .where(QuestionScore.school_id == current.school_id, QuestionScore.student_id == current.student_id, QuestionScore.lost_score > 0)\n 349          .order_by(QuestionScore.lost_score.desc(), Exam.start_date.desc())\n 350          .limit(100)\n 351      )\n 352      if subject:\n 353          query = query.where(Subject.name == subject)\n 354      result = await db.execute(query)\n 355      return [\n 356          {\n 357              \"id\": str(item.id),\n 358              \"exam\": exam.name,\n 359              \"subject\": subject.name,\n 360              \"question_no\": item.question_no,\n 361              \"score\": float(item.score),\n 362              \"full_score\": float(item.full_score),\n 363              \"lost_score\": float(item.lost_score),\n 364              \"answer_status\": item.answer_status,\n 365              \"knowledge_point_id\": str(item.knowledge_point_id) if item.knowledge_point_id else None,\n 366              \"date\": _iso(exam.start_date),\n 367          }\n 368          for item, exam, subject in result.all()\n 369      ]","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#get_student_authorization":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"get_student_authorization","line":381,"end":391,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 381  async def get_student_authorization(\n 382      current: AuthenticatedStudent = Depends(get_current_student),\n 383      db: AsyncSession = Depends(get_db),\n 384  ):\n 385      result = await db.execute(\n 386          select(ParentAuthorization)\n 387          .where(ParentAuthorization.school_id == current.school_id, ParentAuthorization.student_id == current.student_id)\n 388          .order_by(ParentAuthorization.created_at.desc())\n 389          .limit(10)\n 390      )\n 391      return [_authorization_out(item) for item in result.scalars().all()]","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#create_student_authorization":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"create_student_authorization","line":395,"end":413,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 395  async def create_student_authorization(\n 396      data: AuthorizationCreate,\n 397      current: AuthenticatedStudent = Depends(get_current_student),\n 398      db: AsyncSession = Depends(get_db),\n 399  ):\n 400      item = ParentAuthorization(\n 401          school_id=current.school_id,\n 402          student_id=current.student_id,\n 403          parent_name=data.parent_name,\n 404          parent_phone=data.parent_phone,\n 405          share_code=token_urlsafe(8).replace(\"-\", \"\").replace(\"_\", \"\")[:12].upper(),\n 406          scopes=data.scopes,\n 407          status=\"pending\",\n 408          expires_at=datetime.now(timezone.utc) + timedelta(days=7),\n 409      )\n 410      db.add(item)\n 411      await db.commit()\n 412      await db.refresh(item)\n 413      return _authorization_out(item)","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#revoke_student_authorization":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"revoke_student_authorization","line":417,"end":433,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 417  async def revoke_student_authorization(\n 418      authorization_id: UUID,\n 419      current: AuthenticatedStudent = Depends(get_current_student),\n 420      db: AsyncSession = Depends(get_db),\n 421  ):\n 422      item = await db.scalar(\n 423          select(ParentAuthorization).where(\n 424              ParentAuthorization.id == authorization_id,\n 425              ParentAuthorization.school_id == current.school_id,\n 426              ParentAuthorization.student_id == current.student_id,\n 427          )\n 428      )\n 429      if not item:\n 430          raise HTTPException(status_code=404, detail=\"授权记录不存在\")\n 431      item.status = \"revoked\"\n 432      item.revoked_at = datetime.now(timezone.utc)\n 433      await db.commit()","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#approve_parent_authorization":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"approve_parent_authorization","line":437,"end":449,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 437  async def approve_parent_authorization(\n 438      authorization_id: UUID,\n 439      data: ParentApprove,\n 440      db: AsyncSession = Depends(get_db),\n 441  ):\n 442      item = await db.scalar(select(ParentAuthorization).where(ParentAuthorization.id == authorization_id, ParentAuthorization.share_code == data.share_code))\n 443      expires_at = item.expires_at.replace(tzinfo=timezone.utc) if item and item.expires_at and item.expires_at.tzinfo is None else (item.expires_at if item else None)\n 444      if not item or item.status != \"pending\" or (expires_at and expires_at \u003c datetime.now(timezone.utc)):\n 445          raise HTTPException(status_code=400, detail=\"授权链接无效或已过期\")\n 446      item.status = \"active\"\n 447      item.granted_at = datetime.now(timezone.utc)\n 448      await db.commit()\n 449      return {\"status\": \"active\", \"authorization_id\": str(item.id), \"scopes\": item.scopes or []}","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#create_student_feedback":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"create_student_feedback","line":453,"end":469,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 453  async def create_student_feedback(\n 454      data: PlatformFeedbackCreate,\n 455      idempotency_key: UUID | None = Header(default=None),\n 456      current: AuthenticatedStudent = Depends(get_current_student),\n 457      db: AsyncSession = Depends(get_db),\n 458  ):\n 459      if data.message_id:\n 460          message = await db.scalar(\n 461              select(ChatMessage)\n 462              .join(ChatSession, ChatSession.id == ChatMessage.session_id)\n 463              .where(ChatMessage.id == data.message_id, ChatSession.school_id == current.school_id, ChatSession.student_id == current.student_id)\n 464          )\n 465          if not message:\n 466              raise HTTPException(status_code=404, detail=\"消息不存在\")\n 467      item = await create_once(db, current, \"feedback\", data.model_dump(), idempotency_key, PlatformFeedback,\n 468                              dict(school_id=current.school_id, user_id=current.user_id, student_id=current.student_id, **data.model_dump()))\n 469      return {\"id\": str(item.id), \"status\": item.status}","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#management_overview":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"management_overview","line":492,"end":511,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 492  async def management_overview(\n 493      current: AuthenticatedUser = Depends(management_roles),\n 494      db: AsyncSession = Depends(get_db),\n 495  ):\n 496      student_query = _scoped(select(func.count(Student.id)), current, Student.school_id)\n 497      school_query = _scoped(select(func.count(School.id)), current, School.id)\n 498      risk_query = _scoped(select(func.count(RiskEvent.id)).where(RiskEvent.status.in_([\"open\", \"acknowledged\"])), current, RiskEvent.school_id)\n 499      feedback_query = _scoped(select(func.count(PlatformFeedback.id)).where(PlatformFeedback.status == \"open\"), current, PlatformFeedback.school_id)\n 500      handoff_query = _scoped(select(func.count(HumanHandoff.id)).where(HumanHandoff.status.in_([\"open\", \"accepted\"])), current, HumanHandoff.school_id)\n 501      student_count = await db.scalar(student_query)\n 502      school_count = await db.scalar(school_query)\n 503      risk_count = await db.scalar(risk_query)\n 504      feedback_count = await db.scalar(feedback_query)\n 505      handoff_count = await db.scalar(handoff_query)\n 506      return {\n 507          \"scope\": \"city\" if current.has_role(\"CITY_OPERATOR\") or current.has_role(\"SUPER_ADMIN\") else \"teaching\" if is_teacher_only(current) else \"school\",\n 508          \"schools\": int(school_count or 0), \"students\": int(student_count or 0),\n 509          \"open_risks\": int(risk_count or 0), \"open_feedback\": int(feedback_count or 0),\n 510          \"open_handoffs\": int(handoff_count or 0),\n 511      }","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#management_schools":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"management_schools","line":615,"end":658,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 615  async def management_schools(\n 616      current: AuthenticatedUser = Depends(city_roles),\n 617      db: AsyncSession = Depends(get_db),\n 618  ):\n 619      # 优化：使用批量聚合避免 N+1 查询\n 620      schools_result = await db.execute(select(School).order_by(School.name.asc()))\n 621      schools = schools_result.scalars().all()\n 622  \n 623      if not schools:\n 624          return []\n 625  \n 626      school_ids = [school.id for school in schools]\n 627  \n 628      # 批量获取学生数\n 629      student_counts_query = (\n 630          select(Student.school_id, func.count(Student.id))\n 631          .where(Student.school_id.in_(school_ids), Student.status == \"active\")\n 632          .group_by(Student.school_id)\n 633      )\n 634      student_counts = {\n 635          school_id: count for school_id, count in (await db.execute(student_counts_query)).all()\n 636      }\n 637  \n 638      # 批量获取风险数\n 639      risk_counts_query = (\n 640          select(RiskEvent.school_id, func.count(RiskEvent.id))\n 641          .where(RiskEvent.school_id.in_(school_ids), RiskEvent.status.in_([\"open\", \"acknowledged\"]))\n 642          .group_by(RiskEvent.school_id)\n 643      )\n 644      risk_counts = {\n 645          school_id: count for school_id, count in (await db.execute(risk_counts_query)).all()\n 646      }\n 647  \n 648      return [\n 649          {\n 650              \"id\": str(school.id),\n 651              \"name\": school.name,\n 652              \"code\": school.code,\n 653              \"status\": school.status,\n 654              \"students\": int(student_counts.get(school.id, 0)),\n 655              \"open_risks\": int(risk_counts.get(school.id, 0)),\n 656          }\n 657          for school in schools\n 658      ]","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_feedback":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_feedback","line":666,"end":672,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 666  async def student_feedback(current: AuthenticatedStudent = Depends(get_current_student), db: AsyncSession = Depends(get_db)):\n 667      items = (await db.execute(select(PlatformFeedback).where(\n 668          PlatformFeedback.school_id == current.school_id, PlatformFeedback.student_id == current.student_id,\n 669          PlatformFeedback.user_id == current.user_id,\n 670      ).order_by(PlatformFeedback.created_at.desc()).limit(100))).scalars().all()\n 671      return [{\"id\": str(item.id), \"status\": item.status, \"category\": item.category, \"note\": item.note,\n 672               \"resolution\": item.resolution, \"created_at\": _iso(item.created_at)} for item in items]","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_handoffs":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_handoffs","line":676,"end":681,"sha":"45d4a14958bdb78d554afcda50e15b803efec9069 function zoomGraph(state,factor,cx,cy){const newW=Math.min(state.nw*2,Math.max(state.nw/5,state.w/factor)),ratio=newW/state.w;cx??=state.x+state.w/2;cy??=state.y+state.h/2;state.x=cx-(cx-state.x)*ratio;state.y=cy-(cy-state.y)*ratio;state.w*=ratio;state.h*=ratio;setView(state)}

function setupGraphs(root){graphStates.clear();root.querySelectorAll('.graph-canvas svg').forEach(svg=>{const id=svg.id.replace('svg-',''),nw=Number(svg.dataset.naturalWidth),nh=Number(svg.dataset.naturalHeight),state={id,svg,nw,nh,x:0,y:0,w:nw,h:nh};graphStates.set(id,state);let dragging=null,moved=false;svg.addEventListener('pointerdown',event=>{if(event.button!==0||event.target.closest('.graph-node'))return;const p=pointIn(svg,event.clientX,event.clientY);dragging={p,x:state.x,y:state.y};moved=false;svg.setPointerCapture(event.pointerId);svg.parentElement.classList.add('panning')});svg.addEventListener('pointermove',event=>{if(!dragging)return;const p=pointIn(svg,event.clientX,event.clientY);const dx=p.x-dragging.p.x,dy=p.y-dragging.p.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;state.x-=dx;state.y-=dy;setView(state)});const end=()=>{dragging=null;svg.parentElement.classList.remove('panning')};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('wheel',event=>{if(!event.ctrlKey&&!event.metaKey)return;event.preventDefault();const p=pointIn(svg,event.clientX,event.clientY);zoomGraph(state,event.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});svg.addEventListener('click',event=>{const node=event.target.closest('.graph-node');if(node&&!moved)openNode(id,node.dataset.node);moved=false});svg.addEventListener('keydown',event=>{const node=event.target.closest('.graph-node');if(node&&(event.key==='Enter'||event.key===' ')){event.preventDefault();openNode(id,node.dataset.node)}})})}

function handleGraphAction(id,action){const state=graphStates.get(id),d=graphMap.get(id);if(!state||!d)return;if(action==='in'||action==='out'){zoomGraph(state,action==='in'?1.25:.8);return}if(action==='fit'){Object.assign(state,{x:0,y:0,w:state.nw,h:state.nh});setView(state);return}if(action==='actual'){const box=state.svg.getBoundingClientRect();state.w=Math.min(state.nw,Math.max(400,box.width));state.h=state.w*box.height/box.width;state.x=0;state.y=0;setView(state);return}if(action==='full'){const card=document.getElementById('graph-'+id);if(document.fullscreenElement)document.exitFullscreen();else if(card.requestFullscreen)card.requestFullscreen().catch(()=>toast('浏览器不支持此页面全屏，请使用缩放按钮'));else toast('当前浏览器不支持全屏');return}if(action==='svg'){const clone=state.svg.cloneNode(true);clone.setAttribute('viewBox',`0 0 ${state.nw} ${state.nh}`);clone.setAttribute('width',state.nw);clone.setAttribute('height',state.nh);clone.querySelectorAll('.dim,.node-selected').forEach(n=>n.classList.remove('dim','node-selected'));clone.querySelectorAll('[tabindex]').forEach(n=>n.removeAttribute('tabindex'));downloadFile('<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone),'知行-'+d.title.replace(/[· /]/g,'_')+'.svg','image/svg+xml;charset=utf-8');toast('已导出完整矢量流程图');return}if(action==='refs')openDetail(`<span class="node-kind">流程图实现依据</span><h2 id="detailTitle">${E(d.title)}</h2><p class="detail-copy">${E(d.desc)}</p>${d.refs.map(sourceDetails).join('')}`)}

function closeNav(){$('#sidebar').classList.remove('open');$('#navBackdrop').hidden=true;$('#mobileNav').setAttribute('aria-expanded','false')}
const searchIndex=[];
for(const s of A.sections){searchIndex.push({type:'章节',title:s.title,sub:s.subtitle,text:s.title+' '+s.subtitle,section:s.id});for(const d of s.diagrams){searchIndex.push({type:'流程图',title:d.title,sub:s.title,text:d.title+' '+d.desc,section:s.id,graph:d.id});for(const node of d.nodes)searchIndex.push({type:'节点',title:node.title,sub:s.title+' / '+d.title,text:[node.title,node.text,node.detail,...node.tables,...node.api].join(' '),section:s.id,graph:d.id,node:node.id})}for(const t of s.tables)for(const row of t.rows)searchIndex.push({type:'对照表',title:row[0],sub:s.title+' / '+t.title,text:row.join(' '),section:s.id})}
for(const t of A.tables){const info=A.tableInfo[t.name]||[t.model];searchIndex.push({type:'数据表',title:info[0],sub:t.name,text:JSON.stringify(t)+' '+info.join(' ')+' '+t.fields.map(f=>A.fieldLabels[f.name]||'').join(' '),section:'data',table:t.name})}
A.apis.forEach((a,i)=>searchIndex.push({type:'接口',title:a.method+' '+a.path,sub:a.function,text:JSON.stringify(a),section:'sources',api:i}));
A.gaps.forEach(g=>searchIndex.push({type:'实现差异',title:g[0],sub:g[1],text:g[0]+g[1],section:'gaps',ref:g[2]}));
let found=[];
function doSearch(){const q=$('#globalSearch').value.trim().toLowerCase();if(!q){$('#searchResults').innerHTML='<div class="empty-state">输入模块名、字段、接口或业务关键词<br>例如：满分、账号绑定、报告版本、sources</div>';return}found=searchIndex.filter(x=>x.text.toLowerCase().includes(q)).sort((a,b)=>(b.title.toLowerCase().includes(q)?1:0)-(a.title.toLowerCase().includes(q)?1:0)).slice(0,70);$('#searchResults').innerHTML=found.length?found.map((x,i)=>`<button class="search-result" data-search-result="${i}"><em>${E(x.type)}</em><strong>${E(x.title)}</strong><small>${E(x.sub.slice(0,160))}</small></button>`).join(''):'<div class="empty-state">没有找到匹配内容，请试试更短的关键词。</div>'}
function openSearch(){if($('#detailDialog').open)closeDetail();$('#searchDialog').showModal();doSearch();$('#globalSearch').focus()}
function selectResult(i){const x=found[i];$('#searchDialog').close();if(x.table){openTable(x.table);return}const action=()=>{if(x.graph){$('#graph-'+x.graph)?.scrollIntoView({behavior:'smooth',block:'start'});if(x.node)openNode(x.graph,x.node)}else if(x.api!=null){const f=$('#apiFilter');if(f){f.value=A.apis[x.api].path;f.dispatchEvent(new Event('input'));f.scrollIntoView({block:'center'})}}else if(x.ref)openSource(x.ref)};if(activeSection===x.section)action();else{go(x.section);setTimeout(action,80)}}
function preparePrint(){if(printReady)return;$('#printRoot').innerHTML=`<div class="print-cover"><div class="eyebrow">ZHIXING · SYSTEM FLOW ATLAS</div><h1>${E(A.title)}</h1><p>五个业务模块 · 内部流程 · 模块依赖 · 增删改查 · 数据字典 · 问答执行</p><p>源码梳理日期：${A.date} · ${A.stats.diagrams}张流程图 · ${A.stats.nodes}个节点 · ${A.stats.tables}张表 · ${A.stats.fields}个字段</p><p>这是当前工作区代码说明，不代表生产部署验证。实际差异见第14章。</p></div>`+A.sections.map(s=>`<section class="print-section">${sectionMarkup(s,true)}</section>`).join('');printReady=true}
document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(!target)return;if(target.dataset.ref){openSource(target.dataset.ref);return}if(target.dataset.go){closeDetail();go(target.dataset.go);return}if(target.dataset.openTable){openTable(target.dataset.openTable);return}if(target.dataset.openNode){openNode(target.dataset.graph,target.dataset.openNode);return}if(target.dataset.searchResult!=null){selectResult(Number(target.dataset.searchResult));return}if(target.dataset.scroll){event.preventDefault();$('#graph-'+target.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(target.dataset.expand){$$('.schema-card:not([hidden])',$('#content')).forEach(el=>el.open=true);return}if(target.dataset.collapse){$$('.schema-card',$('#content')).forEach(el=>el.open=false);return}if(target.dataset.graphAction){handleGraphAction(target.dataset.graph,target.dataset.graphAction);return}});
$('#closeDetail').addEventListener('click',closeDetail);$('#detailDialog').addEventListener('close',clearHighlights);$('#closeSearch').addEventListener('click',()=>$('#searchDialog').close());$('#searchOpen').addEventListener('click',openSearch);$('#globalSearch').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,100)});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){$('.search-result')?.focus();e.preventDefault()}if(e.key==='Enter'&&found.length){selectResult(0);e.preventDefault()}});$('#mobileNav').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#navBackdrop').hidden=!open;$('#mobileNav').setAttribute('aria-expanded',String(open))});$('#navBackdrop').addEventListener('click',closeNav);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#searchDialog').open){e.preventDefault();openSearch()}if(e.key==='Escape')closeNav()});
$('#printAll').addEventListener('click',()=>{toast('正在准备全量流程图与字段字典…');preparePrint();setTimeout(()=>window.print(),160)});window.addEventListener('beforeprint',preparePrint);
window.addEventListener('hashchange',()=>renderSection(location.hash.slice(1).split('~')[0]));
renderNavigation();renderSection(location.hash.slice(1).split('~')[0]||'overview');
</script>
</body></html>
