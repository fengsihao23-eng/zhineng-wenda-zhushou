       if not plan.ok:\n 456                      item.status = \"failed\"\n 457                      item.report = {\n 458                          **item.report,\n 459                          \"ok\": False,\n 460                          \"issues\": [i.__dict__ for i in plan.issues],\n 461                      }\n 462                      return\n 463                  report = await CsvImportService(db).apply_validated_plan(\n 464                      plan, item.source_system, item.created_by\n 465                  )\n 466                  await db.flush()\n 467                  counts = {}\n 468                  for entry in plan.rows:\n 469                      row, filename = entry.raw_data, entry.file_name\n 470                      model, external_field = {\n 471                          \"students.csv\": (Student, \"external_student_id\"),\n 472                          \"exams.csv\": (Exam, \"external_exam_id\"),\n 473                          \"subjects.csv\": (Subject, \"external_subject_id\"),\n 474                      }.get(filename, (None, None))\n 475                      if model:\n 476                          native = await db.scalar(\n 477                              select(model).where(\n 478                                  model.school_id == item.school_id,\n 479                                  getattr(model, external_field) == row[external_field],\n 480                              )\n 481                          )\n 482                          entity, external_id = model.__tablename__, row[external_field]\n 483                      elif filename in {\n 484                          \"question_scores.csv\",\n 485                          \"student_subject_scores.csv\",\n 486                          \"student_exam_scores.csv\",\n 487                      }:\n 488                          student = await db.scalar(\n 489                              select(Student).where(\n 490                                  Student.school_id == item.school_id,\n 491                                  Student.external_student_id\n 492                                  == row[\"external_student_id\"],\n 493                              )\n 494                          )\n 495                          exam = await db.scalar(\n 496                              select(Exam).where(\n 497                                  Exam.school_id == item.school_id,\n 498                                  Exam.external_exam_id == row[\"external_exam_id\"],\n 499                              )\n 500                          )\n 501                          model = {\n 502                              \"question_scores.csv\": QuestionScore,\n 503                              \"student_subject_scores.csv\": StudentSubjectScore,\n 504                              \"student_exam_scores.csv\": StudentExamScore,\n 505                          }[filename]\n 506                          query = select(model).where(\n 507                              model.school_id == item.school_id,\n 508                              model.student_id == student.id,\n 509                              model.exam_id == exam.id,\n 510                          )\n 511                          if filename != \"student_exam_scores.csv\":\n 512                              subject = await db.scalar(\n 513                                  select(Subject).where(\n 514                                      Subject.school_id == item.school_id,\n 515                                      Subject.external_subject_id\n 516                                      == row[\"external_subject_id\"],\n 517                                  )\n 518                              )\n 519                              query = query.where(model.subject_id == subject.id)\n 520                          if filename == \"question_scores.csv\":\n 521                              query = query.where(model.question_no == row[\"question_no\"])\n 522                          native = await db.scalar(query)\n 523                          entity = model.__tablename__","truncated":true},"apps/api/app/data/import_service.py#apply_validated_plan":{"path":"apps/api/app/data/import_service.py","symbol":"apply_validated_plan","line":375,"end":403,"sha":"5bfa04bcc73f74ad2016dc95cac81b5691dc7be7f1372ee066d2bd919ec5ba26","snippet":" 375      async def apply_validated_plan(self, plan: ImportPlan, source_system: str, created_by: UUID) -> CsvBatchReport:\n 376          \"\"\"Compose the existing importer inside an authenticated workspace transaction.\n 377  \n 378          The caller owns commit/rollback and holds its school/import lock. No\n 379          partial domain or staging writes can survive a failure.\n 380          \"\"\"\n 381          if not plan.ok:\n 382              raise CsvImportError(\"批次预检未通过\")\n 383          existing = await _one(self.db, ImportBatch, ImportBatch.batch_id == plan.batch_id)\n 384          report = CsvBatchReport(batch_id=plan.batch_id, root=\"\", files=plan.files, status=\"succeeded\")\n 385          if existing is not None:\n 386              if existing.status != \"succeeded\" or existing.content_hash != plan.content_hash:\n 387                  raise CsvImportError(\"批次内容冲突\")\n 388              report.imported_rows = existing.success_rows\n 389              report.idempotent = True\n 390              return report\n 391          batch = ImportBatch(batch_id=plan.batch_id, source_system=source_system, root_path=None,\n 392                              content_hash=plan.content_hash, status=\"running\", total_rows=len(plan.rows),\n 393                              created_by=created_by)\n 394          self.db.add(batch)\n 395          await self.db.flush()\n 396          self._stage_rows(batch.id, plan.rows, [], status=\"pending\")\n 397          report.imported_rows = await self._upsert_domain(plan, source_system)\n 398          await self.db.execute(update(ImportRow).where(ImportRow.batch_id == batch.id).values(status=\"imported\"))\n 399          batch.status = \"succeeded\"\n 400          batch.success_rows = report.imported_rows\n 401          batch.finished_at = datetime.now(timezone.utc)\n 402          batch.report_json = report.as_dict()\n 403          return report","truncated":false},"apps/web/src/features/education/SchoolWorkbench.tsx#ClassAnalysisPage":{"path":"apps/web/src/features/education/SchoolWorkbench.tsx","symbol":"ClassAnalysisPage","line":414,"end":474,"sha":"9e14f3d9779c2c360809c5d4a0bfa546158d350f3d43c795848d092cdd0a3f08","snippet":" 414  export function ClassAnalysisPage() {\n 415    const classes = useSchoolOptions(\"classes\"),\n 416      subjects = useSchoolOptions(\"subjects\"),\n 417      exams = useSchoolOptions(\"exams\");\n 418    const [scope, setScope] = useState({\n 419      class_id: \"\",\n 420      subject_id: \"\",\n 421      exam_id: \"\",\n 422    });\n 423    const ready = Object.values(scope).every(Boolean);\n 424    const query = useJsonQuery\u003cRow>(\n 425      `${BASE}/class-analysis?${new URLSearchParams(scope)}`,\n 426      ready,\n 427    );\n 428    const teacher = getRole() === \"teacher\";\n 429    return (\n 430      \u003cAppShell title=\"班级学科分析\" eyebrow=\"教学分析 / 授权任教范围\">\n 431        \u003cdiv className=\"wb-toolbar\">\n 432          {[\n 433            [\"class_id\", \"班级\", classes],\n 434            [\"subject_id\", \"学科\", subjects],\n 435            [\"exam_id\", \"考试\", exams],\n 436          ].map(([key, label, q]) => (\n 437            \u003clabel key={String(key)}>\n 438              {String(label)}\n 439              \u003cselect\n 440                aria-label={String(label)}\n 441                value={scope[key as keyof typeof scope]}\n 442                onChange={(e) =>\n 443                  setScope({ ...scope, [String(key)]: e.target.value })\n 444                }\n 445              >\n 446                \u003coption value=\"\">请选择\u003c/option>\n 447                {(q as typeof classes).data?.items.map((row) => (\n 448                  \u003coption key={row.id} value={row.id}>\n 449                    {row.name}\n 450                  \u003c/option>\n 451                ))}\n 452              \u003c/select>\n 453            \u003c/label>\n 454          ))}\n 455        \u003c/div>\n 456        {[classes, subjects, exams]\n 457          .filter((q) => q.error)\n 458          .map((q, i) => (\n 459            \u003cQueryState key={i} query={q}>\n 460              {null}\n 461            \u003c/QueryState>\n 462          ))}\n 463        {!ready ? (\n 464          \u003cp className=\"inline-empty\">\n 465            选择班级、学科和考试后读取汇总。无任教关系时不会展示全校数据。\n 466          \u003c/p>\n 467        ) : (\n 468          \u003cQueryState query={query}>\n 469            \u003cp>\n 470              样本量：{query.data?.sample_size ?? 0} · 平均分：\n 471              {query.data?.average ?? \"暂无\"} · 最低 / 最高：\n 472              {query.data?.minimum ?? \"—\"} / {query.data?.maximum ?? \"—\"}\n 473            \u003c/p>\n 474            \u003cp className=\"wb-help\">{query.data?.note}\u003c/p>","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#management_students":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"management_students","line":515,"end":611,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 515  async def management_students(\n 516      current: AuthenticatedUser = Depends(management_roles),\n 517      db: AsyncSession = Depends(get_db),\n 518  ):\n 519      # 优化：使用单次查询 + 聚合避免 N+1\n 520      # 1. JOIN 一次获取学生及学校信息。\n 521      students_query = _scoped(\n 522          select(Student, School)\n 523          .join(School, School.id == Student.school_id)\n 524          .where(Student.status == \"active\"),\n 525          current,\n 526          Student.school_id,\n 527      ).order_by(Student.name.asc())\n 528      students = (await db.execute(students_query)).all()\n 529  \n 530      if not students:\n 531          return []\n 532  \n 533      student_ids = [student.id for student, _ in students]\n 534  \n 535      # 2. 批量获取最新成绩（使用窗口函数或子查询，避免 N+1）\n 536      latest_scores_subquery = (\n 537          select(\n 538              StudentExamScore.student_id,\n 539              StudentExamScore.exam_id,\n 540              StudentExamScore.total_score,\n 541              func.row_number()\n 542              .over(\n 543                  partition_by=StudentExamScore.student_id,\n 544                  order_by=(Exam.start_date.desc().nullslast(), Exam.created_at.desc(), Exam.id.desc()),\n 545              )\n 546              .label(\"rn\"),\n 547          )\n 548          .join(Exam, Exam.id == StudentExamScore.exam_id)\n 549          .where(StudentExamScore.student_id.in_(student_ids), not is_teacher_only(current))\n 550          .subquery()\n 551      )\n 552  \n 553      scores_query = (\n 554          select(latest_scores_subquery.c.student_id, latest_scores_subquery.c.total_score, Exam.name)\n 555          .join(Exam, Exam.id == latest_scores_subquery.c.exam_id)\n 556          .where(latest_scores_subquery.c.rn == 1)\n 557      )\n 558      score_by_student = {\n 559          student_id: (float(total_score), exam_name)\n 560          for student_id, total_score, exam_name in (await db.execute(scores_query)).all()\n 561      }\n 562      # Total scores include non-taught subjects. A subject teacher gets only\n 563      # explicitly granted subject rows, never a recomputed pseudo-total.\n 564      subject_by_student: dict[UUID, list[dict]] = {}\n 565      if is_teacher_only(current):\n 566          score_by_student = {}\n 567          subject_rows = await db.execute(scoped_scores(\n 568              select(StudentSubjectScore, Subject, Exam)\n 569              .join(Subject, Subject.id == StudentSubjectScore.subject_id)\n 570              .join(Exam, Exam.id == StudentSubjectScore.exam_id)\n 571              .where(StudentSubjectScore.student_id.in_(student_ids))\n 572              .order_by(Exam.start_date.desc().nullslast(), Exam.created_at.desc()),\n 573              current, StudentSubjectScore,\n 574          ))\n 575          seen = set()\n 576          for score, subject, exam in subject_rows:\n 577              key = (score.student_id, score.subject_id)\n 578              if key in seen:\n 579                  continue\n 580              seen.add(key)\n 581              subject_by_student.setdefault(score.student_id, []).append({\"subject\": subject.name, \"score\": float(score.score), \"exam\": exam.name})\n 582  \n 583      # 3. 批量获取风险计数（单次聚合查询）\n 584      risks_query = (\n 585          select(RiskEvent.student_id, func.count(RiskEvent.id))\n 586          .where(\n 587              RiskEvent.student_id.in_(student_ids),\n 588              RiskEvent.status.in_([\"open\", \"acknowledged\"]),\n 589          )\n 590          .group_by(RiskEvent.student_id)\n 591      )\n 592      risk_by_student = {\n 593          student_id: count for student_id, count in (await db.execute(risks_query)).all() if student_id\n 594      }\n 595  \n 596      # 4. 组装结果（无额外查询）\n 597      return [\n 598          {\n 599              \"id\": str(student.id),\n 600              \"name\": student.name,\n 601              \"student_no\": student.student_no,\n 602              \"school\": school.name,\n 603              \"school_id\": str(student.school_id),\n 604              \"latest_score\": score_by_student[student.id][0] if student.id in score_by_student else None,\n 605              \"latest_exam\": score_by_student[student.id][1] if student.id in score_by_student else None,\n 606              \"subject_scores\": subject_by_student.get(student.id, []),\n 607              \"score_scope\": \"teaching_subjects\" if is_teacher_only(current) else \"all_subjects\",\n 608              \"open_risks\": int(risk_by_student.get(student.id, 0)),\n 609          }\n 610          for student, school in students","truncated":true},"apps/web/src/pages/ManagementPages.tsx#StudentRosterPage":{"path":"apps/web/src/pages/ManagementPages.tsx","symbol":"StudentRosterPage","line":59,"end":119,"sha":"5283e3f892ee7dbbfb23d1084035a85e15a82f5eb0b9de35d42aa60b015cddcb","snippet":"  59  export function StudentRosterPage() {\n  60    const role = useCurrentRole() as Role\n  61    const { data, loading, error, reload } = useData\u003cStudentRow[]>('/platform/management/students')\n  62    const [query, setQuery] = useState('')\n  63    const [onlyRisk, setOnlyRisk] = useState(false)\n  64    const rows = (data || []).filter(row => (row.name + (row.student_no || '') + row.school).includes(query)).filter(row => !onlyRisk || row.open_risks > 0)\n  65    const base = role === 'teacher' ? '/teacher' : '/admin'\n  66    return \u003cAppShell title=\"学生与班级\">\u003cManagementState loading={loading} error={error} onRetry={reload} empty={!data?.length}>\n  67      \u003cp>{role === 'teacher' ? '仅显示当前有效任教班级及学科。没有配置任教关系时不会展示全校数据。' : '当前授权范围内的学生数据。'}\u003c/p>\n  68      \u003cdiv className=\"filter-row\">\u003cinput className=\"filter-input\" placeholder=\"搜索姓名、学号或学校\" value={query} onChange={event => setQuery(event.target.value)} />\u003clabel className=\"check-filter\">\u003cinput type=\"checkbox\" checked={onlyRisk} onChange={event => setOnlyRisk(event.target.checked)} /> 只看待跟进\u003c/label>\u003cspan className=\"subtle\">共 {rows.length} 名学生\u003c/span>\u003c/div>\n  69      {!rows.length ? \u003cdiv className=\"inline-empty\">没有符合筛选条件的学生。\u003c/div> : \u003cdiv className=\"data-table-wrap\">\u003ctable className=\"data-table\">\u003cthead>\u003ctr>\u003cth>学生\u003c/th>\u003cth>学校\u003c/th>\u003cth>{role === 'teacher' ? '任教学科成绩' : '最近考试 / 总分'}\u003c/th>\u003cth>风险\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>{rows.map(row => \u003ctr key={row.id}>\u003ctd>\u003cstrong>{row.name}\u003c/strong>\u003cdiv className=\"subtle\">{row.student_no || '未填写学号'}\u003c/div>\u003c/td>\u003ctd>{row.school}\u003c/td>\u003ctd>{row.score_scope === 'teaching_subjects' ? row.subject_scores?.length ? row.subject_scores.map(score => \u003cdiv key={score.subject}>{score.subject}：{score.score} 分 · {score.exam}\u003c/div>) : '任教学科暂无成绩' : \u003c>{row.latest_exam || '暂无考试'} · {row.latest_score ?? '—'}\u003c/>}\u003c/td>\u003ctd>{row.open_risks} 个待跟进\u003c/td>\u003ctd>\u003cLink className=\"action-link\" to={base + '/students/' + row.id}>查看学情\u003c/Link>\u003c/td>\u003c/tr>)}\u003c/tbody>\u003c/table>\u003c/div>}\n  70    \u003c/ManagementState>\u003c/AppShell>\n  71  }\n  72  \n  73  function workflowTone(status: string) { if (['published', 'resolved', 'closed', 'active', 'accepted'].includes(status)) return 'green'; if (['rejected', 'offline', 'critical'].includes(status)) return 'red'; if (['pending_review', 'open', 'acknowledged', 'pending'].includes(status)) return 'amber'; return 'gray' }\n  74  function workflowLabel(status: string) { const labels: Record\u003cstring, string> = { draft: '草稿', pending_review: '待审核', published: '已发布', rejected: '已驳回', offline: '已下线', open: '待处理', acknowledged: '已确认', accepted: '处理中', resolved: '已解决', closed: '已关闭', pending: '待确认', active: '已授权' }; return labels[status] || status }\n  75  \n  76  export function KnowledgePage() {\n  77    const { data, loading, error, reload } = useData\u003cKnowledge[]>('/platform/management/knowledge')\n  78    const [filter, setFilter] = useState('all')\n  79    const [editor, setEditor] = useState\u003cKnowledge | 'new' | null>(null)\n  80    const rows = (data || []).filter(item => filter === 'all' || item.status === filter)\n  81    return \u003cAppShell title=\"知识库治理\">\u003cManagementState loading={loading} error={error} onRetry={reload}>\n  82      \u003cp className=\"subtle\">文档审核是真实工作流；课程检索与 RAG 尚未接入，发布不代表已用于问答。\u003c/p>\n  83      \u003cdiv className=\"page-toolbar\">\u003cselect className=\"filter-select\" aria-label=\"文档状态\" value={filter} onChange={event => setFilter(event.target.value)}>{['all', 'draft', 'pending_review', 'rejected', 'published', 'offline'].map(status => \u003coption key={status} value={status}>{status === 'all' ? '全部' : workflowLabel(status)}\u003c/option>)}\u003c/select>\u003cbutton className=\"primary-button\" onClick={() => setEditor('new')}>+ 新建文档\u003c/button>\u003c/div>\n  84      {editor && \u003cKnowledgeForm key={editor === 'new' ? 'new' : editor.id} item={editor === 'new' ? undefined : editor} onClose={() => setEditor(null)} />}\n  85      {!rows.length ? \u003cdiv className=\"inline-empty\">当前状态下没有知识文档。\u003c/div> : \u003cdiv className=\"data-table-wrap\">\u003ctable className=\"data-table\">\u003cthead>\u003ctr>\u003cth>文档\u003c/th>\u003cth>来源引用\u003c/th>\u003cth>状态 / 版本\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>{rows.map(item => \u003ctr key={item.id}>\u003ctd>\u003cstrong>{item.title}\u003c/strong>\u003cdiv className=\"subtle\">{item.subject} · {item.doc_type}\u003c/div>{item.rejection_reason && \u003cp>驳回意见：{item.rejection_reason}\u003c/p>}\u003c/td>\u003ctd>{item.source_name}\u003cdiv className=\"subtle\">{item.source_reference}\u003c/div>\u003c/td>\u003ctd>\u003cspan className={'status-pill status-pill--' + workflowTone(item.status)}>{workflowLabel(item.status)}\u003c/span> {item.version}\u003c/td>\u003ctd>\u003cKnowledgeActions item={item} onEdit={() => setEditor(item)} />\u003c/td>\u003c/tr>)}\u003c/tbody>\u003c/table>\u003c/div>}\n  86    \u003c/ManagementState>\u003c/AppShell>\n  87  }\n  88  \n  89  export function FeedbackPage() {\n  90    const { data, loading, error, reload } = useData\u003cFeedback[]>('/platform/management/feedback')\n  91    const [filter, setFilter] = useState('all')\n  92    const rows = (data || []).filter(item => filter === 'all' || item.status === filter)\n  93    return \u003cAppShell title=\"反馈运营\">\u003cManagementState loading={loading} error={error} onRetry={reload}>\n  94      \u003cStatusFilter value={filter} onChange={setFilter} values={['all', 'open', 'acknowledged', 'resolved', 'closed']} />\n  95      {!rows.length && \u003cdiv className=\"inline-empty\">当前没有符合条件的反馈。\u003c/div>}\n  96      \u003cdiv className=\"feedback-grid\">{rows.map(item => \u003carticle className=\"feedback-card\" key={item.id}>\u003cdiv className=\"feedback-card__top\">\u003cstrong>{item.category}\u003c/strong>\u003cspan className={'status-pill status-pill--' + workflowTone(item.status)}>{workflowLabel(item.status)}\u003c/span>\u003c/div>\u003cp>{item.note || '用户未填写补充说明。'}\u003c/p>\u003cp className=\"subtle\">提交于 {item.created_at?.slice(0, 16).replace('T', ' ') || '—'}\u003c/p>\u003cWorkflowControls kind=\"feedback\" item={item} />\u003c/article>)}\u003c/div>\n  97    \u003c/ManagementState>\u003c/AppShell>\n  98  }\n  99  \n 100  function StatusFilter({ value, onChange, values }: { value: string; onChange: (value: string) => void; values: string[] }) {\n 101    return \u003cdiv className=\"page-toolbar\">\u003cselect className=\"filter-select\" aria-label=\"处理状态\" value={value} onChange={event => onChange(event.target.value)}>{values.map(status => \u003coption key={status} value={status}>{status === 'all' ? '全部' : workflowLabel(status)}\u003c/option>)}\u003c/select>\u003c/div>\n 102  }\n 103  \n 104  export function RiskPage() {\n 105    const { data, loading, error, reload } = useData\u003cRisk[]>('/platform/management/risks')\n 106    const [filter, setFilter] = useState('all')\n 107    const rows = (data || []).filter(item => filter === 'all' || item.status === filter)\n 108    return \u003cAppShell title=\"风险事件看板\">\u003cManagementState loading={loading} error={error} onRetry={reload}>\n 109      \u003cStatusFilter value={filter} onChange={setFilter} values={['all', 'open', 'acknowledged', 'resolved', 'closed']} />\n 110      \u003cp className=\"subtle\">先确认事件，再填写实际处理结果。系统风险标记不等于最终判断。\u003c/p>\n 111      {!rows.length && \u003cdiv className=\"inline-empty\">当前没有符合条件的风险事件。\u003c/div>}\n 112      \u003cdiv className=\"risk-list\">{rows.map(item => \u003carticle className={'risk-card risk-card--' + item.severity} key={item.id}>\u003cdiv className=\"risk-card__signal\">\u003ch3>{item.title}\u003c/h3>\u003cspan>{({ low: '低风险', medium: '中风险', high: '高风险', critical: '严重' } as Record\u003cstring, string>)[item.severity]}\u003c/span>\u003cspan className={'status-pill status-pill--' + workflowTone(item.status)}>{workflowLabel(item.status)}\u003c/span>\u003c/div>\u003cp>{item.detail}\u003c/p>\u003cp className=\"subtle\">来源：{item.source}\u003c/p>\u003cWorkflowControls kind=\"risk\" item={item} />\u003c/article>)}\u003c/div>\n 113    \u003c/ManagementState>\u003c/AppShell>\n 114  }\n 115  \n 116  export function HandoffPage() {\n 117    const { data, loading, error, reload } = useData\u003cHandoff[]>('/platform/management/handoffs')\n 118    const [filter, setFilter] = useState('all')\n 119    const rows = (data || []).filter(item => filter === 'all' || item.status === filter)","truncated":false},"apps/api/app/api/v1/endpoints/management_details.py#student_detail":{"path":"apps/api/app/api/v1/endpoints/management_details.py","symbol":"student_detail","line":25,"end":60,"sha":"2ad23afb10e9f19db0aab263e9a6ed081839f333cc6c8508ee402771fb67caef","snippet":"  25  async def student_detail(student_id: UUID, current: AuthenticatedUser = Depends(management), db: AsyncSession = Depends(get_db)):\n  26      student = await db.scalar(scoped(select(Student).where(Student.id == student_id, Student.status == \"active\"), current, Student.school_id))\n  27      if student is None:\n  28          raise ApiError(404, \"STUDENT_NOT_FOUND\", \"学生不存在或不在授权任教范围\")\n  29      scores = (await db.execute(scoped_scores(\n  30          select(StudentSubjectScore, Subject, Exam)\n  31          .join(Subject, Subject.id == StudentSubjectScore.subject_id)\n  32          .join(Exam, Exam.id == StudentSubjectScore.exam_id)\n  33          .where(StudentSubjectScore.student_id == student_id, StudentSubjectScore.school_id == student.school_id)\n  34          .order_by(Exam.start_date.desc().nullslast(), Subject.name).limit(200), current, StudentSubjectScore,\n  35      ))).all()\n  36      questions = (await db.execute(scoped_scores(\n  37          select(QuestionScore, Subject, Exam)\n  38          .join(Subject, Subject.id == QuestionScore.subject_id).join(Exam, Exam.id == QuestionScore.exam_id)\n  39          .where(QuestionScore.student_id == student_id, QuestionScore.school_id == student.school_id, QuestionScore.lost_score > 0)\n  40          .order_by(QuestionScore.lost_score.desc()).limit(100), current, QuestionScore,\n  41      ))).all()\n  42      totals = []\n  43      if not is_teacher_only(current):\n  44          totals = (await db.execute(select(StudentExamScore, Exam).join(Exam, Exam.id == StudentExamScore.exam_id)\n  45                    .where(StudentExamScore.school_id == student.school_id, StudentExamScore.student_id == student_id)\n  46                    .order_by(Exam.start_date.desc().nullslast()).limit(20))).all()\n  47      db.add(AuditLog(action=\"student.learning.read\", actor_type=\"management\", actor_id=current.user_id,\n  48                      resource_type=\"student\", resource_id=student_id, allowed=True,\n  49                      extra_data={\"school_id\": str(student.school_id), \"scope\": \"teaching\" if is_teacher_only(current) else \"school\"}))\n  50      await db.commit()\n  51      return {\n  52          \"student\": {\"id\": str(student.id), \"name\": student.name, \"student_no\": student.student_no},\n  53          \"scope\": \"teaching_subjects\" if is_teacher_only(current) else \"all_subjects\",\n  54          \"subject_scores\": [{\"exam\": exam.name, \"subject\": subject.name, \"score\": float(score.score), \"full_score\": float(score.full_score),\n  55                              \"class_rank\": score.class_rank, \"date\": exam.start_date.isoformat() if exam.start_date else None}\n  56                             for score, subject, exam in scores],\n  57          \"exam_scores\": [{\"exam\": exam.name, \"score\": float(score.total_score)} for score, exam in totals],\n  58          \"question_losses\": [{\"exam\": exam.name, \"subject\": subject.name, \"question_no\": score.question_no,\n  59                               \"lost_score\": float(score.lost_score)} for score, subject, exam in questions],\n  60      }","truncated":false},"apps/api/app/services/curriculum.py#inspect_file":{"path":"apps/api/app/services/curriculum.py","symbol":"inspect_file","line":47,"end":99,"sha":"5a3a16c20058a450c138ad66ac57eef846b02552d812a9fa0ae95a2a7226870c","snippet":"  47  def inspect_file(upload):\n  48      if (\n  49          \"/\" in upload.filename\n  50          or \"\\\\\" in upload.filename\n  51          or any(ord(c) \u003c 32 for c in upload.filename)\n  52      ):\n  53          raise ApiError(422, \"INVALID_FILENAME\", \"文件名不能包含路径或控制字符。\")\n  54      try:\n  55          content = base64.b64decode(upload.content_base64, validate=True)\n  56      except (ValueError, binascii.Error):\n  57          raise ApiError(422, \"INVALID_FILE\", \"文件编码无效。\")\n  58      if not content or len(content) > MAX_FILE_BYTES:\n  59          raise ApiError(413, \"FILE_TOO_LARGE\", \"原件大小须在 1 字节至 15 MB 之间。\")\n  60      suffix = PurePath(upload.filename).suffix.lower()\n  61      pages = []\n  62      try:\n  63          if content.startswith(b\"%PDF-\") and suffix == \".pdf\":\n  64              import pypdfium2 as pdfium\n  65  \n  66              document = pdfium.PdfDocument(content)\n  67              if not 1 \u003c= len(document) \u003c= 100:\n  68                  raise ValueError(\"page limit\")\n  69              for index in range(len(document)):\n  70                  page = document[index]\n  71                  width, height = page.get_size()\n  72                  if not (0 \u003c width \u003c= 20000 and 0 \u003c height \u003c= 20000):\n  73                      raise ValueError(\"page size\")\n  74                  pages.append({\"page\": index + 1, \"width\": width, \"height\": height})\n  75                  page.close()\n  76              document.close()\n  77              media_type = \"application/pdf\"\n  78          elif (content.startswith(b\"\\x89PNG\\r\\n\\x1a\\n\") and suffix == \".png\") or (\n  79              content.startswith(b\"\\xff\\xd8\\xff\") and suffix in {\".jpg\", \".jpeg\"}\n  80          ):\n  81              from PIL import Image\n  82  \n  83              image = Image.open(io.BytesIO(content))\n  84              if (\n  85                  image.width * image.height > 30_000_000\n  86                  or image.width \u003c= 0\n  87                  or image.height \u003c= 0\n  88              ):\n  89                  raise ValueError(\"image size\")\n  90              image.verify()\n  91              pages = [{\"page\": 1, \"width\": image.width, \"height\": image.height}]\n  92              media_type = \"image/png\" if suffix == \".png\" else \"image/jpeg\"\n  93          else:\n  94              raise ValueError(\"unsupported type\")\n  95      except ImportError:\n  96          raise ApiError(503, \"FILE_PARSER_UNAVAILABLE\", \"原件校验组件未安装，请联系管理员配置。\")\n  97      except Exception:\n  98          raise ApiError(422, \"INVALID_FILE\", \"仅支持有效的 PDF、PNG、JPEG，最多 100 页；文件类型须与扩展名一致。\")\n  99      return content, media_type, pages","truncated":false},"apps/api/app/services/curriculum.py#upload_asset":{"path":"apps/api/app/services/curriculum.py","symbol":"upload_asset","line":102,"end":144,"sha":"5a3a16c20058a450c138ad66ac57eef846b02552d812a9fa0ae95a2a7226870c","snippet":" 102  async def upload_asset(db, actor, upload, key):\n 103      content, media_type, pages = inspect_file(upload)\n 104      content_hash = hashlib.sha256(content).hexdigest()\n 105      identifier, fresh = await claim(\n 106          db,\n 107          actor,\n 108          \"asset.upload\",\n 109          key,\n 110          {\"filename\": upload.filename, \"hash\": content_hash},\n 111      )\n 112      if fresh:\n 113          item = PrivateAsset(\n 114              id=identifier,\n 115              school_id=actor.school_id,\n 116              filename=upload.filename,\n 117              media_type=media_type,\n 118              byte_size=len(content),\n 119              content_hash=content_hash,\n 120              content=content,\n 121              pages=pages,\n 122              storage_key=f\"{actor.school_id}/{identifier}/{content_hash}\",\n 123              created_by=actor.user_id,\n 124          )\n 125          db.add(item)\n 126          audit(\n 127              db,\n 128              actor,\n 129              \"asset.upload\",\n 130              item,\n 131              {\"bytes\": len(content), \"hash\": content_hash},\n 132          )\n 133          await db.commit()\n 134      item = await owned(db, PrivateAsset, identifier, actor)\n 135      return data(\n 136          item,\n 137          \"id\",\n 138          \"filename\",\n 139          \"media_type\",\n 140          \"byte_size\",\n 141          \"content_hash\",\n 142          \"pages\",\n 143          \"created_at\",\n 144      )","truncated":false},"apps/web/src/features/education/EvidenceWorkbench.tsx#ReportWorkbenchPage":{"path":"apps/web/src/features/education/EvidenceWorkbench.tsx","symbol":"ReportWorkbenchPage","line":168,"end":228,"sha":"59a2fd73398f0a99c7141ec4821bcde947e7d565b810b1788469f4dbfcb0dafc","snippet":" 168  export function ReportWorkbenchPage() {\n 169    const list = useJsonQuery\u003cRow[]>(`${BASE}/reports`),\n 170      students = useSchoolOptions(\"students\"),\n 171      exams = useSchoolOptions(\"exams\"),\n 172      subjects = useSchoolOptions(\"subjects\"),\n 173      action = useAction();\n 174    const [asset, setAsset] = useState\u003cRow | null>(null);\n 175    return (\n 176      \u003cAppShell title=\"正式报告与原件\" eyebrow=\"教学分析 / 报告版本\">\n 177        \u003cReadOnlyNote />\n 178        \u003cp>\n 179          人工确认后的正式报告与原件按版本保存；不会自动批改或扩大学生诊断权益。学生端每次查看原件重新核验授权。\n 180        \u003c/p>\n 181        \u003cQueryState query={list} empty={!list.data?.length}>\n 182          \u003cTable headers={[\"学生 / 考试\", \"类型 / 版本\", \"来源 / 时间\", \"原件\"]}>\n 183            {list.data?.map((r) => (\n 184              \u003ctr key={r.id}>\n 185                \u003ctd>\n 186                  {students.data?.items.find((s) => s.id === r.student_id)\n 187                    ?.name || \"本校学生\"}{\" \"}\n 188                  /{\" \"}\n 189                  {exams.data?.items.find((e) => e.id === r.exam_id)?.name ||\n 190                    \"历史考试\"}\n 191                \u003c/td>\n 192                \u003ctd>\n 193                  {(\n 194                    {\n 195                      diagnosis: \"学情诊断\",\n 196                      score_report: \"成绩报告\",\n 197                      marked_work: \"批阅文件\",\n 198                    } as Record\u003cstring, string>\n 199                  )[r.report_type] || r.report_type}{\" \"}\n 200                  · {r.version || \"待补充\"}\n 201                \u003c/td>\n 202                \u003ctd>\n 203                  {r.source_system} · {r.generated_at?.slice(0, 16)}\n 204                \u003c/td>\n 205                \u003ctd>\n 206                  {r.asset_id ? (\n 207                    \u003cAssetButton id={r.asset_id} />\n 208                  ) : (\n 209                    \u003cspan>原件尚未接入\u003c/span>\n 210                  )}\n 211                \u003c/td>\n 212              \u003c/tr>\n 213            ))}\n 214          \u003c/Table>\n 215        \u003c/QueryState>\n 216        {canWrite() && (\n 217          \u003csection className=\"panel\">\n 218            \u003ch2>保存新报告版本\u003c/h2>\n 219            \u003cAssetUpload label=\"上传正式报告原件\" onUploaded={setAsset} />\n 220            {asset && (\n 221              \u003c>\n 222                \u003cp role=\"status\">原件已保存：{asset.filename}\u003c/p>\n 223                \u003cFormPanel\n 224                  key={asset.id}\n 225                  title=\"绑定正式报告\"\n 226                  fields={[\n 227                    {\n 228                      name: \"student_id\",","truncated":false},"apps/api/app/services/learning_workbench.py#create_report":{"path":"apps/api/app/services/learning_workbench.py","symbol":"create_report","line":176,"end":231,"sha":"faa9e24209bc1bcce18e4478cff1212fcf0445bb514f0f947ece15cfbcda20ee","snippet":" 176  async def create_report(db, actor, body, key):\n 177      await owned(db, Student, body.student_id, actor)\n 178      await owned(db, Exam, body.exam_id, actor)\n 179      await owned(db, PrivateAsset, body.asset_id, actor)\n 180      if body.subject_id:\n 181          await owned(db, Subject, body.subject_id, actor)\n 182      identifier, fresh = await claim(\n 183          db, actor, \"report.create\", key, body.model_dump(mode=\"json\")\n 184      )\n 185      if fresh:\n 186          from app.services.curriculum import assert_asset_purpose\n 187  \n 188          await assert_asset_purpose(db, actor, body.asset_id, \"report\")\n 189          collision = await db.scalar(\n 190              select(DiagnosisReport.id).where(\n 191                  DiagnosisReport.school_id == actor.school_id,\n 192                  DiagnosisReport.student_id == body.student_id,\n 193                  DiagnosisReport.exam_id == body.exam_id,\n 194                  DiagnosisReport.subject_id == body.subject_id,\n 195                  DiagnosisReport.report_type == body.report_type,\n 196                  DiagnosisReport.version == body.version,\n 197              )\n 198          )\n 199          if collision:\n 200              raise ApiError(409, \"REPORT_VERSION_EXISTS\", \"该学生、考试、科目和类型的报告版本已存在，请发布新版本。\")\n 201          item = DiagnosisReport(\n 202              id=identifier,\n 203              school_id=actor.school_id,\n 204              student_id=body.student_id,\n 205              exam_id=body.exam_id,\n 206              subject_id=body.subject_id,\n 207              report_type=body.report_type,\n 208              version=body.version,\n 209              raw_content=body.raw_content,\n 210              structured_json={\"summary\": body.summary},\n 211              generated_at=body.generated_at,\n 212              status=\"generated\",\n 213              source_system=\"native\",\n 214          )\n 215          db.add(item)\n 216          await db.flush()\n 217          db.add(\n 218              ReportAttachment(\n 219                  school_id=actor.school_id, report_id=identifier, asset_id=body.asset_id\n 220              )\n 221          )\n 222          audit(db, actor, \"report.create\", item)\n 223          await db.commit()\n 224      return data(\n 225          await owned(db, DiagnosisReport, identifier, actor),\n 226          \"id\",\n 227          \"version\",\n 228          \"status\",\n 229          \"source_system\",\n 230          \"generated_at\",\n 231      )","truncated":false},"apps/api/app/services/curriculum.py#assert_asset_purpose":{"path":"apps/api/app/services/curriculum.py","symbol":"assert_asset_purpose","line":168,"end":188,"sha":"5a3a16c20058a450c138ad66ac57eef846b02552d812a9fa0ae95a2a7226870c","snippet":" 168  async def assert_asset_purpose(db, actor, asset_id, purpose):\n 169      await owned(db, PrivateAsset, asset_id, actor, lock=True)\n 170      report = await db.scalar(\n 171          select(ReportAttachment.id)\n 172          .where(\n 173              ReportAttachment.school_id == actor.school_id,\n 174              ReportAttachment.asset_id == asset_id,\n 175          )\n 176          .limit(1)\n 177      )\n 178      paper = await db.scalar(\n 179          select(PaperVersion.id)\n 180          .where(\n 181              PaperVersion.school_id == actor.school_id, PaperVersion.asset_id == asset_id\n 182          )\n 183          .limit(1)\n 184      )\n 185      if report or (purpose == \"report\" and paper):\n 186          raise ApiError(\n 187              409, \"ASSET_PURPOSE_CONFLICT\", \"报告原件不能复用于试卷或其他报告，请上传独立原件以保持权限边界。\"\n 188          )","truncated":false},"apps/api/app/core/diagnosis_access.py#authorized_reports":{"path":"apps/api/app/core/diagnosis_access.py","symbol":"authorized_reports","line":29,"end":40,"sha":"8ac0b4dc0f57c5553bf6097301ffd8f1ade9fcfe36ac33789650a88a5a865f35","snippet":"  29  def authorized_reports(school_id, student_id):\n  30      r, e = DiagnosisReport, StudentEntitlement\n  31      grant = exists(select(e.id).where(\n  32          *active_entitlements(school_id, student_id),\n  33          or_(\n  34              and_(e.resource_id.is_(None), or_(e.resource_type.is_(None), e.resource_type.in_([\"all\", \"student\"]))),\n  35              and_(e.resource_type == \"exam\", e.resource_id == r.exam_id),\n  36              and_(e.resource_type.in_([\"report\", \"diagnosis_report\"]), e.resource_id == r.id),\n  37              and_(e.resource_type == \"subject\", e.resource_id == r.subject_id),\n  38          ),\n  39      ))\n  40      return select(r).where(r.school_id == school_id, r.student_id == student_id, r.status == \"generated\", grant)","truncated":false},"apps/api/app/core/diagnosis_access.py#require_report":{"path":"apps/api/app/core/diagnosis_access.py","symbol":"require_report","line":59,"end":65,"sha":"8ac0b4dc0f57c5553bf6097301ffd8f1ade9fcfe36ac33789650a88a5a865f35","snippet":"  59  async def require_report(db, actor, report_id):\n  60      await require_diagnosis(db, actor)\n  61      report = await db.scalar(authorized_reports(actor.school_id, actor.student_id).where(DiagnosisReport.id == report_id))\n  62      if report is None:\n  63          await audit_report_access(db, actor, False, report_id, \"REPORT_NOT_AVAILABLE\")\n  64          raise ApiError(404, \"REPORT_NOT_AVAILABLE\", \"报告不存在、未正式发布或不在授权范围内。\")\n  65      return report","truncated":false},"apps/api/app/api/v1/endpoints/education.py#asset_access":{"path":"apps/api/app/api/v1/endpoints/education.py","symbol":"asset_access","line":423,"end":474,"sha":"c0ff8cbf2a42f57bd60a8bbb0db430fedacfddcfe4659102fe68801772e2fafe","snippet":" 423  async def asset_access(db, actor, identifier):\n 424      allowed = any(actor.has_role(r) for r in (\"SCHOOL_ADMIN\", \"QA\", \"SUPER_ADMIN\"))\n 425      if is_teacher_only(actor):\n 426          allowed = bool(\n 427              await db.scalar(\n 428                  select(PaperVersion.id)\n 429                  .join(Paper, Paper.id == PaperVersion.paper_id)\n 430                  .where(\n 431                      PaperVersion.school_id == actor.school_id,\n 432                      PaperVersion.asset_id == identifier,\n 433                      Paper.id.in_(c.teacher_paper_ids(actor)),\n 434                  )\n 435                  .limit(1)\n 436              )\n 437          )\n 438      if not allowed and actor.has_role(\"STUDENT\"):\n 439          student = await get_current_student(actor, db)\n 440          attachments = (\n 441              await db.scalars(\n 442                  select(ReportAttachment).where(\n 443                      ReportAttachment.school_id == actor.school_id,\n 444                      ReportAttachment.asset_id == identifier,\n 445                  )\n 446              )\n 447          ).all()\n 448          if attachments:\n 449              # One asset may have only one report owner (enforced on attachment writes).\n 450              await require_report(db, student, attachments[0].report_id)\n 451              await audit_report_access(db, student, True, attachments[0].report_id)\n 452              allowed = True\n 453          else:\n 454              allowed = bool(\n 455                  await db.scalar(\n 456                      select(PaperVersion.id)\n 457                      .join(Paper, Paper.id == PaperVersion.paper_id)\n 458                      .join(\n 459                          StudentSubjectScore,\n 460                          (StudentSubjectScore.exam_id == Paper.exam_id)\n 461                          & (StudentSubjectScore.subject_id == Paper.subject_id),\n 462                      )\n 463                      .where(\n 464                          PaperVersion.school_id == actor.school_id,\n 465                          PaperVersion.asset_id == identifier,\n 466                          StudentSubjectScore.school_id == actor.school_id,\n 467                          StudentSubjectScore.student_id == student.student_id,\n 468                      )\n 469                      .limit(1)\n 470                  )\n 471              )\n 472      if not allowed:\n 473          raise ApiError(404, \"ASSET_NOT_AVAILABLE\", \"原件不存在或不在授权范围内。\")\n 474      return await owned(db, PrivateAsset, identifier, actor)","truncated":false},"apps/api/app/api/v1/endpoints/platform.py#student_diagnosis_source":{"path":"apps/api/app/api/v1/endpoints/platform.py","symbol":"student_diagnosis_source","line":323,"end":335,"sha":"45d4a14958bdb78d554afcda50e15b803efec90696720b4837deb8d786704f73","snippet":" 323  async def student_diagnosis_source(\n 324      report_id: UUID,\n 325      current: AuthenticatedStudent = Depends(get_current_student),\n 326      db: AsyncSession = Depends(get_db),\n 327  ):\n 328      report = await require_report(db, current, report_id)\n 329      if not report.raw_content or not report.raw_content.strip():\n 330          raise ApiError(404, \"REPORT_SOURCE_MISSING\", \"该版本尚未接入报告原始内容，不能以摘要代替原件。\")\n 331      exam = await db.scalar(select(Exam).where(Exam.id == report.exam_id, Exam.school_id == current.school_id)) if report.exam_id else None\n 332      await audit_report_access(db, current, True, report.id)\n 333      return {\"id\": str(report.id), \"version\": report.version, \"raw_content\": report.raw_content,\n 334              \"source\": report.source_system, \"generated_at\": _iso(report.generated_at),\n 335              \"exam_name\": exam.name if exam else None, \"source_kind\": \"stored_text\"}","truncated":false},"apps/api/app/tools/analysis_tools.py#GetDiagnosisTool":{"path":"apps/api/app/tools/analysis_tools.py","symbol":"GetDiagnosisTool","line":347,"end":412,"sha":"b8c4cbe20998a624a096738163ae92ec9e010ebf8dab83f5bec0a8a2b0bc34d8","snippet":" 347  class GetDiagnosisTool(BaseTool):\n 348      \"\"\"获取诊断报告Tool\"\"\"\n 349  \n 350      def __init__(self, db: AsyncSession):\n 351          self.db = db\n 352  \n 353      @property\n 354      def name(self) -> str:\n 355          return \"get_diagnosis\"\n 356  \n 357      @property\n 358      def description(self) -> str:\n 359          return \"\"\"\n 360  获取学生的诊断报告，包括知识点诊断、学习建议等。\n 361  需要DIAGNOSIS权益才能使用。\n 362  \"\"\"\n 363  \n 364      @property\n 365      def input_schema(self) -> dict:\n 366          return {\n 367              \"type\": \"object\",\n 368              \"properties\": {\n 369                  \"exam_id\": {\n 370                      \"type\": \"string\",\n 371                      \"description\": \"考试ID，可选，不提供则返回最近一次\"\n 372                  }\n 373              }\n 374          }\n 375  \n 376      @property\n 377      def required_entitlement(self) -> str:\n 378          return \"DIAGNOSIS\"\n 379  \n 380      async def execute(\n 381          self,\n 382          tool_context: ToolContext,\n 383          args: dict\n 384      ) -> ToolResult:\n 385          \"\"\"Re-check database grants on every call; context claims are not authority.\"\"\"\n 386          from app.core.diagnosis_access import authorized_reports, require_diagnosis, audit_report_access\n 387          from app.core.errors import ApiError\n 388          try:\n 389              await require_diagnosis(self.db, tool_context)\n 390              query = authorized_reports(tool_context.school_id, tool_context.student_id)\n 391              if args.get(\"exam_id\"):\n 392                  query = query.where(DiagnosisReport.exam_id == UUID(args[\"exam_id\"]))\n 393              report = await self.db.scalar(query.order_by(DiagnosisReport.generated_at.desc(), DiagnosisReport.id.desc()).limit(1))\n 394              if report is None:\n 395                  await audit_report_access(self.db, tool_context, False, reason=\"REPORT_NOT_AVAILABLE\")\n 396                  return ToolResult(ok=False, data={}, error_code=\"DIAGNOSIS_NOT_FOUND\", error_message=\"没有可读取的正式诊断报告\")\n 397              exam = await self.db.scalar(select(Exam).where(Exam.id == report.exam_id, Exam.school_id == tool_context.school_id)) if report.exam_id else None\n 398              await audit_report_access(self.db, tool_context, True, report.id)\n 399              return ToolResult(ok=True, data={\n 400                  \"report_id\": str(report.id), \"version\": report.version,\n 401                  \"exam_id\": str(report.exam_id) if report.exam_id else None,\n 402                  \"exam_name\": exam.name if exam else None, \"report_type\": report.report_type,\n 403                  \"status\": report.status, \"structured\": report.structured_json,\n 404                  \"generated_at\": report.generated_at.isoformat() if report.generated_at else None,\n 405              }, evidence=[EvidenceRef(type=\"diagnosis_report\", resource_id=str(report.id),\n 406                                      label=f\"{exam.name if exam else '综合学情'}诊断报告\", as_of=report.updated_at)])\n 407          except ApiError as exc:\n 408              return ToolResult(ok=False, data={}, error_code=exc.code, error_message=exc.user_message)\n 409          except (ValueError, TypeError):\n 410              return ToolResult(ok=False, data={}, error_code=\"INVALID_ARGUMENT\", error_message=\"考试参数格式不正确\")\n 411          except Exception:\n 412              return ToolResult(ok=False, data={}, error_code=\"TOOL_EXECUTION_ERROR\", error_message=\"数据查询失败，请稍后重试\")","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#set_session_context":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"set_session_context","line":402,"end":423,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 402  async def set_session_context(session_id: UUID, body: SessionContextRequest, current_user: AuthenticatedStudent = Depends(get_current_student), db: AsyncSession = Depends(get_db)):\n 403      await _get_session(session_id, current_user, db)\n 404      session = await db.scalar(select(ChatSession).where(ChatSession.id == session_id).with_for_update().execution_options(populate_existing=True))\n 405      if session.selected_exam_id == body.exam_id and session.selected_subject_id == body.subject_id:\n 406          return await get_session_context(session_id, current_user, db)\n 407      if session.context_version != body.expected_version:\n 408          raise ApiError(409, 'CONTEXT_CONFLICT', '会话范围已变化，请刷新后重试。')\n 409      pending = await db.scalar(select(ChatMessage.id).where(ChatMessage.session_id == session_id, ChatMessage.role == 'user', ChatMessage.agent_run_id.is_(None)).limit(1))\n 410      if pending:\n 411          raise ApiError(409, 'MESSAGE_IN_PROGRESS', '请等待当前回答结束后切换范围。')\n 412      if body.exam_id and not await db.scalar(select(StudentExamScore.id).where(StudentExamScore.exam_id == body.exam_id, StudentExamScore.school_id == current_user.school_id, StudentExamScore.student_id == current_user.student_id)):\n 413          raise ApiError(404, 'EXAM_NOT_AVAILABLE', '该考试没有你的可访问成绩。')\n 414      if body.subject_id:\n 415          query = select(StudentSubjectScore.id).where(StudentSubjectScore.subject_id == body.subject_id, StudentSubjectScore.school_id == current_user.school_id, StudentSubjectScore.student_id == current_user.student_id)\n 416          if body.exam_id:\n 417              query = query.where(StudentSubjectScore.exam_id == body.exam_id)\n 418          if not await db.scalar(query.limit(1)):\n 419              raise ApiError(404, 'SUBJECT_NOT_AVAILABLE', '当前考试没有该学科的本人数据。')\n 420      session.selected_exam_id, session.selected_subject_id = body.exam_id, body.subject_id\n 421      session.context_version += 1\n 422      await db.commit()\n 423      return await get_session_context(session_id, current_user, db)","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#_save_user_message":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"_save_user_message","line":159,"end":216,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 159  async def _save_user_message(\n 160      session: ChatSession,\n 161      request_data: MessageCreateRequest,\n 162      db: AsyncSession,\n 163  ) -> tuple[ChatMessage, bool]:\n 164      session = await db.scalar(select(ChatSession).where(ChatSession.id == session.id).with_for_update().execution_options(populate_existing=True))\n 165      if session.status != 'active':\n 166          raise ApiError(409, 'SESSION_INACTIVE', '会话已归档，请新建会话。')\n 167      if request_data.client_message_id:\n 168          existing_result = await db.execute(\n 169              select(ChatMessage).where(ChatMessage.id == request_data.client_message_id)\n 170          )\n 171          existing = existing_result.scalar_one_or_none()\n 172          if existing:\n 173              if (\n 174                  existing.session_id != session.id\n 175                  or existing.role != \"user\"\n 176                  or existing.content != request_data.content.strip()\n 177              ):\n 178                  raise ApiError(\n 179                      status.HTTP_409_CONFLICT,\n 180                      \"CLIENT_MESSAGE_ID_CONFLICT\",\n 181                      \"client_message_id 已用于另一条消息\",\n 182                  )\n 183              return existing, False\n 184  \n 185      message = ChatMessage(\n 186          id=request_data.client_message_id or uuid4(),\n 187          session_id=session.id,\n 188          role=\"user\",\n 189          content=request_data.content.strip(),\n 190          selected_context={'exam_id': str(session.selected_exam_id) if session.selected_exam_id else None,\n 191                            'subject_id': str(session.selected_subject_id) if session.selected_subject_id else None,\n 192                            'version': session.context_version},\n 193      )\n 194      db.add(message)\n 195      session.last_message_at = datetime.now(timezone.utc)\n 196      session.updated_at = datetime.now(timezone.utc)\n 197      try:\n 198          await db.commit()\n 199      except IntegrityError:\n 200          await db.rollback()\n 201          # A concurrent retry may have inserted the same client id between the\n 202          # lookup and insert. Return that canonical row to preserve idempotency.\n 203          if request_data.client_message_id:\n 204              existing_result = await db.execute(\n 205                  select(ChatMessage).where(\n 206                      ChatMessage.id == request_data.client_message_id,\n 207                      ChatMessage.session_id == session.id,\n 208                      ChatMessage.role == \"user\",\n 209                  )\n 210              )\n 211              existing = existing_result.scalar_one_or_none()\n 212              if existing:\n 213                  return existing, False\n 214          raise\n 215      await db.refresh(message)\n 216      return message, True","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#_find_idempotent_reply":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"_find_idempotent_reply","line":232,"end":265,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 232  async def _find_idempotent_reply(\n 233      session: ChatSession,\n 234      request_data: MessageCreateRequest,\n 235      db: AsyncSession,\n 236  ) -> ChatMessage | None:\n 237      \"\"\"Return a completed reply for a retried client message, if available.\"\"\"\n 238      if request_data.client_message_id is None:\n 239          return None\n 240      result = await db.execute(\n 241          select(ChatMessage).where(\n 242              ChatMessage.id == request_data.client_message_id,\n 243              ChatMessage.session_id == session.id,\n 244              ChatMessage.role == \"user\",\n 245          )\n 246      )\n 247      existing_user = result.scalar_one_or_none()\n 248      if existing_user is None:\n 249          return None\n 250      if existing_user.content != request_data.content.strip():\n 251          raise HTTPException(\n 252              status_code=status.HTTP_409_CONFLICT,\n 253              detail=\"client_message_id 已用于另一条消息\",\n 254              headers={\"X-Error-Code\": \"CLIENT_MESSAGE_ID_CONFLICT\"},\n 255          )\n 256      if existing_user.agent_run_id is None:\n 257          return None\n 258      reply_result = await db.execute(\n 259          select(ChatMessage).where(\n 260              ChatMessage.session_id == session.id,\n 261              ChatMessage.role == \"assistant\",\n 262              ChatMessage.agent_run_id == existing_user.agent_run_id,\n 263          ).order_by(ChatMessage.created_at.desc()).limit(1)\n 264      )\n 265      return reply_result.scalar_one_or_none()","truncated":false},"apps/api/app/agent/agent_loop.py#_build_messages":{"path":"apps/api/app/agent/agent_loop.py","symbol":"_build_messages","line":258,"end":292,"sha":"454b52280d212a4a091b253b2281b13ac94ba4962e95a2fd0649abfe69e5830e","snippet":" 258      def _build_messages(\n 259          self,\n 260          context: StudentContext,\n 261          user_query: str,\n 262          history: list[dict],\n 263          results: list[ToolResult],\n 264          system_prompt: str | None = None,\n 265      ) -> list[dict]:\n 266          messages = [\n 267              {\n 268                  \"role\": \"system\",\n 269                  \"content\": system_prompt or (\n 270                      \"你是学生成绩问答助手。只使用已提供的本人数据回答，不能编造数字；\"\n 271                      \"如果数据不存在，要明确说明。\\n\" + context.to_prompt_context()\n 272                  ),\n 273              }\n 274          ]\n 275          messages.extend(history[-6:])\n 276          messages.append({\"role\": \"user\", \"content\": user_query})\n 277          for result in results:\n 278              messages.append(\n 279                  {\n 280                      # Tools are executed deterministically before the model\n 281                      # call. A plain system context message keeps the request\n 282                      # valid for providers that require a matching assistant\n 283                      # tool_call message for every ``role=tool`` item.\n 284                      \"role\": \"system\",\n 285                      \"content\": \"[TOOL_RESULT] \"\n 286                      + json.dumps(\n 287                          result.data if result.ok else {\"error\": result.error_code},\n 288                          ensure_ascii=False,\n 289                      ),\n 290                  }\n 291              )\n 292          return messages","truncated":false},"apps/api/app/agent/context.py#build_context":{"path":"apps/api/app/agent/context.py","symbol":"build_context","line":78,"end":156,"sha":"684aacc8ebc02e6f1fb8fad7bf197e0d6ccfbb969def533d5091171c796e328a","snippet":"  78      async def build_context(\n  79          self,\n  80          student_id: UUID,\n  81          school_id: UUID,\n  82          selected_exam_id: UUID | None = None,\n  83      ) -> StudentContext:\n  84          \"\"\"构建学生上下文\"\"\"\n  85  \n  86          # 1. 查询学生基本信息\n  87          student_result = await self.db.execute(\n  88              select(Student).where(\n  89                  Student.id == student_id,\n  90                  Student.school_id == school_id\n  91              )\n  92          )\n  93          student = student_result.scalar_one_or_none()\n  94  \n  95          if not student:\n  96              raise ValueError(f\"Student not found: {student_id}\")\n  97  \n  98          # 2. 查询权益等级\n  99          entitlement_level = \"DIAGNOSIS\" if await has_diagnosis_entitlement(self.db, school_id, student_id) else \"BASIC\"\n 100  \n 101          # 3. 查询最近的考试成绩（最多5次）\n 102          exam_filter = []\n 103          if selected_exam_id:\n 104              selected = await self.db.scalar(select(Exam).where(Exam.id == selected_exam_id, Exam.school_id == school_id))\n 105              if selected is None:\n 106                  raise ValueError(\"考试不在当前范围\")\n 107              exam_filter = [Exam.start_date \u003c= selected.start_date] if selected.start_date else [Exam.created_at \u003c= selected.created_at]\n 108          recent_scores_result = await self.db.execute(\n 109              select(StudentExamScore, Exam).join(\n 110                  Exam,\n 111                  and_(\n 112                      StudentExamScore.exam_id == Exam.id,\n 113                      Exam.school_id == school_id,\n 114                  ),\n 115              ).where(\n 116                  StudentExamScore.student_id == student_id,\n 117                  StudentExamScore.school_id == school_id,\n 118                  *exam_filter,\n 119              )\n 120              .order_by((Exam.id == selected_exam_id).desc() if selected_exam_id else Exam.start_date.desc(), Exam.start_date.desc(), Exam.created_at.desc())\n 121              .limit(5)\n 122          )\n 123          recent_scores = recent_scores_result.all()\n 124  \n 125          # 4. 构造考试列表\n 126          recent_exams = []\n 127          latest_exam = None\n 128  \n 129          for idx, (score, exam) in enumerate(recent_scores):\n 130              exam_data = {\n 131                  \"exam_id\": str(exam.id),\n 132                  \"exam_name\": exam.name,\n 133                  \"exam_date\": exam.start_date.isoformat() if exam.start_date else None,\n 134                  \"total_score\": float(score.total_score),\n 135                  \"full_score\": float(score.full_score) if score.full_score and score.full_score > 0 else None,\n 136                  \"class_rank\": score.class_rank,\n 137                  \"grade_rank\": score.grade_rank,\n 138                  \"class_student_count\": score.class_student_count,\n 139                  \"grade_student_count\": score.grade_student_count\n 140              }\n 141              recent_exams.append(exam_data)\n 142  \n 143              if idx == 0:\n 144                  latest_exam = exam_data\n 145  \n 146          # 5. 返回上下文对象\n 147          return StudentContext(\n 148              student_id=student_id,\n 149              school_id=school_id,\n 150              student_name=student.name,\n 151              grade_id=student.grade_id,\n 152              class_id=student.class_id,\n 153              entitlement_level=entitlement_level,\n 154              recent_exams=recent_exams,\n 155              latest_exam=latest_exam\n 156          )","truncated":false},"apps/api/app/ai/gateway.py#chat":{"path":"apps/api/app/ai/gateway.py","symbol":"chat","line":102,"end":154,"sha":"c4cea0be4f7d7168ecab7c1ee94cfb783c2f1cc453865368ab427548a71de2ee","snippet":" 102      async def chat(\n 103          self,\n 104          model: str = \"deepseek-chat\",\n 105          messages: list = None,\n 106          tools: list[dict] | None = None,\n 107          temperature: float = 0.7,\n 108          max_tokens: int | None = None,\n 109          timeout: int = 30,\n 110          trace_context: dict | None = None\n 111      ) -> ModelResponse:\n 112          \"\"\"统一对话调用\"\"\"\n 113          provider = self._get_provider(model)\n 114  \n 115          # 转换ChatMessage对象为dict\n 116          message_dicts = []\n 117          for msg in messages:\n 118              if hasattr(msg, 'dict'):\n 119                  msg_dict = msg.dict(exclude_none=True)\n 120              elif isinstance(msg, dict):\n 121                  msg_dict = msg\n 122              else:\n 123                  msg_dict = {\"role\": msg.role, \"content\": msg.content}\n 124              message_dicts.append(msg_dict)\n 125  \n 126          try:\n 127              response = await asyncio.wait_for(\n 128                  provider.chat(\n 129                      model=self._model_for_provider(provider, model),\n 130                      messages=message_dicts,\n 131                      tools=tools,\n 132                      temperature=temperature,\n 133                      max_tokens=max_tokens,\n 134                  ),\n 135                  timeout=timeout\n 136              )\n 137  \n 138              # 记录使用情况\n 139              if trace_context:\n 140                  await self._track_usage(\n 141                      provider=provider,\n 142                      model=model,\n 143                      usage=response.usage,\n 144                      trace_context=trace_context,\n 145                  )\n 146  \n 147              return response\n 148  \n 149          except asyncio.TimeoutError:\n 150              logger.error(f\"Model call timeout after {timeout}s\")\n 151              raise\n 152          except Exception as e:\n 153              logger.error(f\"Model call failed: {e}\")\n 154              raise","truncated":false},"apps/api/app/core/response_guard.py#validate":{"path":"apps/api/app/core/response_guard.py","symbol":"validate","line":17,"end":63,"sha":"6e1e9718ad7c1ce83c87d1d5fdf5b37d48ad5f28fa594d54320bda112677d78c","snippet":"  17      async def validate(\n  18          self,\n  19          answer: str,\n  20          context: StudentContext,\n  21          entitlement: str,\n  22          allowed_numbers: set[float] | None = None,\n  23      ) -> GuardResult:\n  24          \"\"\"\n  25          验证答案\n  26  \n  27          Args:\n  28              answer: 模型生成的答案\n  29              context: 学生上下文\n  30              entitlement: 权益等级\n  31  \n  32          Returns:\n  33              GuardResult: 验证结果\n  34          \"\"\"\n  35          issues = []\n  36  \n  37          # 1. 数字准确性检查\n  38          if self.config.check_numbers:\n  39              issues.extend(self._check_numbers(answer, context, allowed_numbers))\n  40  \n  41          # 2. 权益边界检查\n  42          if entitlement == \"BASIC\" and self.config.check_basic_boundary:\n  43              issues.extend(self._check_basic_boundary(answer))\n  44          elif entitlement == \"DIAGNOSIS\":\n  45              # DIAGNOSIS用户暂不做特殊检查，后续可添加\n  46              pass\n  47  \n  48          # 3. 隐私保护检查\n  49          if self.config.check_privacy:\n  50              issues.extend(self._check_privacy(answer, context))\n  51  \n  52          # 4. 逻辑一致性检查\n  53          if self.config.check_logic:\n  54              issues.extend(self._check_logic_consistency(answer))\n  55  \n  56          # 决定处理动作\n  57          action = self._decide_action(issues)\n  58  \n  59          return GuardResult(\n  60              ok=len(issues) == 0,\n  61              issues=issues,\n  62              action=action\n  63          )","truncated":false},"apps/api/app/core/response_guard.py#_decide_action":{"path":"apps/api/app/core/response_guard.py","symbol":"_decide_action","line":195,"end":221,"sha":"6e1e9718ad7c1ce83c87d1d5fdf5b37d48ad5f28fa594d54320bda112677d78c","snippet":" 195      def _decide_action(self, issues: list[str]) -> str:\n 196          \"\"\"\n 197          根据问题严重程度决定处理动作\n 198  \n 199          Args:\n 200              issues: 问题列表\n 201  \n 202          Returns:\n 203              'pass' | 'warn' | 'block'\n 204          \"\"\"\n 205          if not issues:\n 206              return \"pass\"\n 207  \n 208          # 高危问题 - 必须阻断\n 209          high_severity_keywords = [\"其他学生\", \"捏造\", \"超出合理范围\"]\n 210          for issue in issues:\n 211              if any(keyword in issue for keyword in high_severity_keywords):\n 212                  return \"block\"\n 213  \n 214          # 中危问题 - 警告但放行\n 215          medium_severity_keywords = [\"诊断性措辞\", \"矛盾\"]\n 216          for issue in issues:\n 217              if any(keyword in issue for keyword in medium_severity_keywords):\n 218                  return \"warn\"\n 219  \n 220          # 默认警告\n 221          return \"warn\"","truncated":false},"apps/api/app/api/v1/endpoints/chat.py#stream_message":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"stream_message","line":486,"end":637,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 486  async def stream_message(\n 487      session_id: UUID,\n 488      data: MessageCreateRequest,\n 489      request: Request,\n 490      current_user: AuthenticatedStudent = Depends(get_current_student),\n 491      db: AsyncSession = Depends(get_db),\n 492  ):\n 493      session = await _get_session(session_id, current_user, db)\n 494      existing = await _find_idempotent_reply(session, data, db)\n 495      if existing is None:\n 496          user_message, created = await _save_user_message(session, data, db)\n 497          if not created:\n 498              user_message = None\n 499              in_progress = True\n 500          else:\n 501              in_progress = False\n 502      else:\n 503          user_message = None\n 504          in_progress = False\n 505      history = await _history(session.id, db)\n 506      request_id = getattr(request.state, \"request_id\", str(uuid4()))\n 507  \n 508      async def event_generator():\n 509          seq = 1\n 510          assistant_committed = False\n 511          try:\n 512              if existing is not None:\n 513                  yield _sse(\n 514                      \"message_start\",\n 515                      {\"session_id\": str(session.id), \"message_id\": str(existing.id)},\n 516                      request_id,\n 517                      seq,\n 518                  )\n 519                  seq += 1\n 520                  yield _sse(\"content_delta\", {\"content\": existing.content}, request_id, seq)\n 521                  seq += 1\n 522                  for source in existing.sources or []:\n 523                      yield _sse('source', source, request_id, seq)\n 524                      seq += 1\n 525                  yield _sse(\n 526                      \"message_end\",\n 527                      {\"message_id\": str(existing.id), \"agent_run_id\": str(existing.agent_run_id)},\n 528                      request_id,\n 529                      seq,\n 530                  )\n 531                  seq += 1\n 532                  yield _sse(\"done\", {\"session_id\": str(session.id), \"resumed\": True}, request_id, seq)\n 533                  return\n 534              if in_progress:\n 535                  yield _sse(\n 536                      \"error\",\n 537                      {\"code\": \"MESSAGE_IN_PROGRESS\", \"message\": \"消息正在处理中，请稍后重试\"},\n 538                      request_id,\n 539                      seq,\n 540                  )\n 541                  return\n 542              if await request.is_disconnected():\n 543                  return\n 544              yield _sse(\n 545                  \"message_start\",\n 546                  {\"session_id\": str(session.id), \"message_id\": str(user_message.id)},\n 547                  request_id,\n 548                  seq,\n 549              )\n 550              seq += 1\n 551              result = await _run_agent(request, current_user, db, data.content, session, history)\n 552              if user_message is not None:\n 553                  user_message.agent_run_id = UUID(result.agent_run_id)\n 554              sources = getattr(result, \"sources\", [])\n 555              for step in getattr(result, \"steps\", []):\n 556                  yield _sse(\n 557                      \"tool_call_start\",\n 558                      {\"tool_name\": step.tool_name, \"arguments\": step.tool_args or {}},\n 559                      request_id,\n 560                      seq,\n 561                  )\n 562                  seq += 1\n 563                  yield _sse(\n 564                      \"tool_call_end\",\n 565                      {\"tool_name\": step.tool_name, \"ok\": bool(step.tool_result and step.tool_result.get(\"ok\"))},\n 566                      request_id,\n 567                      seq,\n 568                  )\n 569                  seq += 1\n 570              for source in sources:\n 571                  yield _sse(\"source\", source, request_id, seq)\n 572                  seq += 1\n 573              yield _sse(\"content_delta\", {\"content\": result.final_answer}, request_id, seq)\n 574              seq += 1\n 575  \n 576              assistant = ChatMessage(\n 577                  session_id=session.id,\n 578                  role=\"assistant\",\n 579                  content=result.final_answer,\n 580                  agent_run_id=UUID(result.agent_run_id),\n 581                  sources=sources,","truncated":true},"apps/api/app/api/v1/endpoints/chat.py#archive_session":{"path":"apps/api/app/api/v1/endpoints/chat.py","symbol":"archive_session","line":641,"end":648,"sha":"f8976c8d13c744e4b2b38274e0aff12b161c200e8f60e04231a4d8648941e823","snippet":" 641  async def archive_session(\n 642      session_id: UUID,\n 643      current_user: AuthenticatedStudent = Depends(get_current_student),\n 644      db: AsyncSession = Depends(get_db),\n 645  ):\n 646      session = await _get_session(session_id, current_user, db)\n 647      session.status = \"archived\"\n 648      await db.commit()","truncated":false},"apps/web/src/hooks/useStreamChat.ts":{"path":"apps/web/src/hooks/useStreamChat.ts","symbol":null,"line":1,"end":72,"sha":"3ab68fa0fc35da422bdfc251496207ac606e8e13a1e68d2084e2588e67307d23","snippet":"   1  import { useCallback, useEffect, useMemo, useRef, useState } from 'react';\n   2  import { useQueryClient } from '@tanstack/react-query';\n   3  import { apiError, apiFetch } from '../services/api';\n   4  import { errorMessage, isAbortError } from '../services/http';\n   5  import { getAuthScope } from '../utils/auth';\n   6  import { queryKeys, scopedQueryKey, useApiQuery, useAuthScope } from './useApi';\n   7  \n   8  export interface Message {\n   9    id: string;\n  10    role: 'user' | 'assistant' | 'system';\n  11    content: string;\n  12    created_at: string;\n  13    agent_run_id?: string;\n  14    sources?: Array\u003cRe
