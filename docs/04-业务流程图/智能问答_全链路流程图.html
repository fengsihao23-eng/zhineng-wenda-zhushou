 ? [...navByRole.city, { path: '/admin/school', label: '本校教务工作台', icon: 'users', group: '业务生产' }] : navByRole[role]\n  70    const health = useJsonQuery\u003c{ model?: { real_model_ready?: boolean } }>('/health')\n  71    const serviceState = health.isLoading ? 'loading' : health.error ? 'unavailable' : health.data?.model?.real_model_ready ? 'ready' : 'model_pending'\n  72    const [collapsed, setCollapsed] = useState(() => {","truncated":false},"apps/api/app/agent/agent_loop.py#run":{"path":"apps/api/app/agent/agent_loop.py","symbol":"run","line":69,"end":234,"sha":"454b52280d212a4a091b253b2281b13ac94ba4962e95a2fd0649abfe69e5830e","snippet":"  69      async def run(\n  70          self,\n  71          user_query: str,\n  72          student_id: UUID,\n  73          school_id: UUID,\n  74          user_id: UUID,\n  75          request_id: str,\n  76          chat_history: List[dict] | None = None,\n  77          session_id: UUID | None = None,\n  78          selected_exam_id: UUID | None = None,\n  79          selected_subject_name: str | None = None,\n  80      ) -> AgentResponse:\n  81          if len(user_query.strip()) == 0 or len(user_query) > 4000:\n  82              raise ValueError(\"消息长度必须在1到4000个字符之间\")\n  83  \n  84          run_id = uuid4()\n  85          context = await self.context_builder.build_context(student_id, school_id, selected_exam_id)\n  86          intent = self.intent_router.route(user_query)\n  87          entities = self.intent_router.extract_entities(user_query)\n  88          if selected_exam_id:\n  89              entities['exam_id'] = str(selected_exam_id)\n  90          if selected_subject_name:\n  91              entities['subject_name'] = selected_subject_name\n  92              context.selected_subject_name = selected_subject_name\n  93              context.recent_exams = [{k:v for k,v in exam.items() if k in {'exam_id','exam_name','exam_date'}} for exam in context.recent_exams]\n  94              context.latest_exam = context.recent_exams[0] if context.recent_exams else None\n  95          tool_context = ToolContext(\n  96              request_id=request_id,\n  97              agent_run_id=str(run_id),\n  98              user_id=user_id,\n  99              school_id=school_id,\n 100              student_id=student_id,\n 101              entitlement_level=context.entitlement_level,\n 102          )\n 103  \n 104          run_model = AgentRun(\n 105              id=run_id,\n 106              session_id=session_id,\n 107              school_id=school_id,\n 108              student_id=student_id,\n 109              query=user_query,\n 110              intent=intent.name,\n 111              entitlement_level=context.entitlement_level,\n 112              status=\"running\",\n 113              created_at=datetime.now(timezone.utc),\n 114          )\n 115          self.db.add(run_model)\n 116          await self.db.commit()\n 117  \n 118          steps: list[AgentStep] = []\n 119          sources: list[dict] = []\n 120          tool_results: list[ToolResult] = []\n 121          tools_called = 0\n 122          try:\n 123              tool_names = list(intent.suggested_tools[:1])\n 124              if selected_subject_name and tool_names == ['get_exam_summary']:\n 125                  tool_names = ['get_subject_scores']\n 126              for tool_name in tool_names:\n 127                  tool = self.tool_registry.get(tool_name)\n 128                  if not tool:\n 129                      continue\n 130                  args = self._tool_args(tool_name, entities)\n 131                  try:\n 132                      result = await tool.execute(tool_context=tool_context, args=args)\n 133                  except Exception as exc:\n 134                      # A denied/failed tool should be represented as tool data so\n 135                      # the model can explain the limitation; it must not turn a\n 136                      # valid chat request into an internal 500.\n 137                      result = ToolResult(\n 138                          ok=False,\n 139                          data={},\n 140                          error_code=getattr(exc, \"code\", \"TOOL_EXECUTION_ERROR\"),\n 141                          error_message=\"当前请求无法访问该数据\",\n 142                      )\n 143                  tools_called += 1\n 144                  tool_results.append(result)\n 145                  sources.extend([item.model_dump() for item in result.evidence])\n 146                  steps.append(\n 147                      AgentStep(\n 148                          step_number=len(steps) + 1,\n 149                          tool_name=tool_name,\n 150                          tool_args=args,\n 151                          tool_result=result.model_dump(),\n 152                          reasoning=f\"根据意图 {intent.name} 查询本人学习数据\",\n 153                      )\n 154                  )\n 155                  self.db.add(\n 156                      ToolCallLog(\n 157                          agent_run_id=run_id,\n 158                          tool_name=tool_name,\n 159                          input_json=args,\n 160                          output_summary_json={\"ok\": result.ok, \"data\": result.data},\n 161                          status=\"success\" if result.ok else \"failed\",\n 162                          error_code=result.error_code,\n 163                      )\n 164                  )","truncated":true},"apps/api/app/services/school_workbench.py#class_analysis":{"path":"apps/api/app/services/school_workbench.py","symbol":"class_analysis","line":377,"end":554,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 377  async def class_analysis(db, actor, class_id, subject_id, exam_id):\n 378      classroom = await owned(db, ImportedClass, class_id, actor)\n 379      await owned(db, Subject, subject_id, actor)\n 380      await owned(db, Exam, exam_id, actor)\n 381      if is_teacher_only(actor) and not await db.scalar(\n 382          select(TeachingAssignment.id).where(\n 383              *active_grants(actor),\n 384              TeachingAssignment.class_id == class_id,\n 385              TeachingAssignment.subject_id == subject_id,\n 386          )\n 387      ):\n 388          raise ApiError(404, \"CLASS_NOT_AVAILABLE\", \"该班级学科不在任教范围内。\")\n 389      in_class = or_(\n 390          Student.class_id == class_id,\n 391          and_(\n 392              Student.class_id.is_(None),\n 393              Student.external_class_id == classroom.external_class_id,\n 394          ),\n 395      )\n 396      base = (\n 397          select(StudentSubjectScore)\n 398          .join(Student, Student.id == StudentSubjectScore.student_id)\n 399          .where(\n 400              StudentSubjectScore.school_id == actor.school_id,\n 401              Student.school_id == actor.school_id,\n 402              in_class,\n 403              StudentSubjectScore.subject_id == subject_id,\n 404              StudentSubjectScore.exam_id == exam_id,\n 405          )\n 406      )\n 407      scores = (await db.scalars(base)).all()\n 408      values = [float(s.score) for s in scores]\n 409      distribution = [\n 410          {\"label\": \"低于 60%\", \"count\": 0},\n 411          {\"label\": \"60%–80%\", \"count\": 0},\n 412          {\"label\": \"80% 及以上\", \"count\": 0},\n 413          {\"label\": \"满分未知\", \"count\": 0},\n 414      ]\n 415      for score in scores:\n 416          rate = (\n 417              float(score.score) / float(score.full_score)\n 418              if score.full_score and score.full_score > 0\n 419              else None\n 420          )\n 421          bucket = 3 if rate is None else 0 if rate \u003c 0.6 else 1 if rate \u003c 0.8 else 2\n 422          distribution[bucket][\"count\"] += 1\n 423      selected_exam = await owned(db, Exam, exam_id, actor)\n 424      previous = None\n 425      if selected_exam.start_date:\n 426          prior_exam = await db.scalar(\n 427              select(Exam)\n 428              .join(StudentSubjectScore, StudentSubjectScore.exam_id == Exam.id)\n 429              .join(Student, Student.id == StudentSubjectScore.student_id)\n 430              .where(\n 431                  Exam.school_id == actor.school_id,\n 432                  StudentSubjectScore.school_id == actor.school_id,\n 433                  Student.school_id == actor.school_id,\n 434                  in_class,\n 435                  StudentSubjectScore.subject_id == subject_id,\n 436                  Exam.start_date \u003c selected_exam.start_date,\n 437              )\n 438              .order_by(Exam.start_date.desc())\n 439              .limit(1)\n 440          )\n 441          if prior_exam:\n 442              prior_scores = (\n 443                  await db.scalars(\n 444                      select(StudentSubjectScore)\n 445                      .join(Student, Student.id == StudentSubjectScore.student_id)\n 446                      .where(\n 447                          StudentSubjectScore.school_id == actor.school_id,\n 448                          Student.school_id == actor.school_id,\n 449                          in_class,\n 450                          StudentSubjectScore.subject_id == subject_id,\n 451                          StudentSubjectScore.exam_id == prior_exam.id,\n 452                      )\n 453                  )\n 454              ).all()\n 455              average = sum(float(s.score) for s in prior_scores) / len(prior_scores)\n 456              full_scores = {\n 457                  float(s.full_score)\n 458                  for s in [*scores, *prior_scores]\n 459                  if s.full_score and s.full_score > 0\n 460              }\n 461              comparable = len(full_scores) == 1 and all(\n 462                  s.full_score and s.full_score > 0 for s in [*scores, *prior_scores]\n 463              )\n 464              previous = {\n 465                  \"exam\": prior_exam.name,\n 466                  \"sample_size\": len(prior_scores),\n 467 kind == \"students\":\n  93              query = scoped(query, actor, model.school_id)\n  94          else:\n  95              query = query.where(\n  96                  model.id.in_(\n  97                      scoped_scores(\n  98                          select(StudentSubjectScore.exam_id), actor, StudentSubjectScore\n  99                      )\n 100                  )\n 101              )\n 102      if search and hasattr(model, \"name\"):\n 103          query = query.where(model.name.contains(search, autoescape=True))\n 104      total = int(\n 105          await db.scalar(select(func.count()).select_from(query.subquery())) or 0\n 106      )\n 107      rows = (\n 108          await db.scalars(\n 109              query.order_by(model.id).offset((page - 1) * page_size).limit(page_size)\n 110          )\n 111      ).all()\n 112      return {\n 113          \"items\": [\n 114              {\n 115                  **data(row, *FIELDS[kind]),\n 116                  **({\"name\": row.display_name} if kind == \"teachers\" else {}),\n 117              }\n 118              for row in rows\n 119          ],\n 120          \"total\": total,\n 121          \"page\": page,\n 122          \"page_size\": page_size,\n 123      }","truncated":false},"apps/api/app/services/education_common.py#claim":{"path":"apps/api/app/services/education_common.py","symbol":"claim","line":86,"end":109,"sha":"953643ea67b140f331302bbfc651a2681a92effa7294fe5069cf42823dbf9560","snippet":"  86  async def claim(db, actor, operation, key, payload):\n  87      \"\"\"Reserve a receipt in the caller's transaction; never commit partial work.\"\"\"\n  88      content_hash = digest(payload)\n  89      request_hash = digest(\n  90          [str(actor.school_id), str(actor.user_id), operation, str(key or content_hash)]\n  91      )\n  92      identifier = uuid4()\n  93      insert = pg_insert if db.get_bind().dialect.name == \"postgresql\" else sqlite_insert\n  94      result = await db.scalar(\n  95          insert(OperationReceipt)\n  96          .values(\n  97              request_hash=request_hash, payload_hash=content_hash, resource_id=identifier\n  98          )\n  99          .on_conflict_do_nothing(index_elements=[\"request_hash\"])\n 100          .returning(OperationReceipt.resource_id)\n 101      )\n 102      if result is not None:\n 103          return identifier, True\n 104      receipt = await db.scalar(\n 105          select(OperationReceipt).where(OperationReceipt.request_hash == request_hash)\n 106      )\n 107      if receipt.payload_hash != content_hash:\n 108          raise ApiError(409, \"IDEMPOTENCY_KEY_CONFLICT\", \"同一提交标识对应的内容已变化，请刷新后重新提交。\")\n 109      return receipt.resource_id, False","truncated":false},"apps/api/app/services/school_workbench.py#create":{"path":"apps/api/app/services/school_workbench.py","symbol":"create","line":173,"end":192,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 173  async def create(db, actor, kind, body, key):\n 174      model = MODELS[kind]\n 175      if kind == \"teaching\":\n 176          await validate_teaching(db, actor, body)\n 177      if kind == \"students\":\n 178          classroom = await owned(db, ImportedClass, body.class_id, actor)\n 179          if classroom.status != \"active\":\n 180              raise ApiError(422, \"CLASS_INACTIVE\", \"不能把学生加入停用班级。\")\n 181      identifier, fresh = await claim(\n 182          db, actor, f\"{kind}.create\", key, body.model_dump(mode=\"json\")\n 183      )\n 184      if fresh:\n 185          values = body.model_dump()\n 186          if kind != \"teaching\":\n 187              values[\"source_system\"] = \"native\"\n 188          item = model(id=identifier, school_id=actor.school_id, **values)\n 189          db.add(item)\n 190          audit(db, actor, f\"{kind}.create\", item)\n 191          await db.commit()\n 192      return data(await owned(db, model, identifier, actor), *FIELDS[kind])","truncated":false},"apps/api/app/services/school_workbench.py#update_record":{"path":"apps/api/app/services/school_workbench.py","symbol":"update_record","line":195,"end":238,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 195  async def update_record(db, actor, kind, identifier, body):\n 196      item = await owned(db, MODELS[kind], identifier, actor, lock=True)\n 197      if kind != \"teaching\":\n 198          native_only(item)\n 199      if kind == \"teaching\":\n 200          await validate_teaching(db, actor, body)\n 201      if kind == \"students\":\n 202          classroom = await owned(db, ImportedClass, body.class_id, actor)\n 203          if classroom.status != \"active\" and body.status == \"active\":\n 204              raise ApiError(422, \"CLASS_INACTIVE\", \"不能加入停用班级。\")\n 205      if kind == \"classes\" and body.status == \"inactive\":\n 206          active_students = await db.scalar(\n 207              select(Student.id)\n 208              .where(\n 209                  Student.school_id == actor.school_id,\n 210                  Student.status == \"active\",\n 211                  or_(\n 212                      Student.class_id == item.id,\n 213                      and_(\n 214                          Student.class_id.is_(None),\n 215                          Student.external_class_id == item.external_class_id,\n 216                      ),\n 217                  ),\n 218              )\n 219              .limit(1)\n 220          )\n 221          active_teaching = await db.scalar(\n 222              select(TeachingAssignment.id)\n 223              .where(\n 224                  TeachingAssignment.school_id == actor.school_id,\n 225                  TeachingAssignment.class_id == item.id,\n 226                  TeachingAssignment.status == \"active\",\n 227              )\n 228              .limit(1)\n 229          )\n 230          if active_students or active_teaching:\n 231              raise ApiError(409, \"CLASS_REFERENCED\", \"请先调整在籍学生和有效任教关系，再停用班级；历史成绩会保留。\")\n 232      changed = any(getattr(item, k) != v for k, v in body.model_dump().items())\n 233      if changed:\n 234          for field, value in body.model_dump().items():\n 235              setattr(item, field, value)\n 236          audit(db, actor, f\"{kind}.update\", item)\n 237          await db.commit()\n 238      return data(item, *FIELDS[kind])","truncated":false},"apps/api/app/services/school_workbench.py#bind_student":{"path":"apps/api/app/services/school_workbench.py","symbol":"bind_student","line":268,"end":300,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 268  async def bind_student(db, actor, identifier, body):\n 269      student = await owned(db, Student, identifier, actor, lock=True)\n 270      user = await db.scalar(\n 271          select(User.id)\n 272          .join(\n 273              UserRole,\n 274              and_(UserRole.user_id == User.id, UserRole.school_id == User.school_id),\n 275          )\n 276          .join(Role, Role.id == UserRole.role_id)\n 277          .where(\n 278              User.id == body.user_id,\n 279              User.school_id == actor.school_id,\n 280              User.status == \"active\",\n 281              Role.code == \"STUDENT\",\n 282          )\n 283          .with_for_update(of=User)\n 284      )\n 285      if user is None:\n 286          raise ApiError(422, \"STUDENT_ACCOUNT_REQUIRED\", \"请选择本校有效学生账号。\")\n 287      occupied = await db.scalar(\n 288          select(Student.id).where(\n 289              Student.school_id == actor.school_id,\n 290              Student.user_id == body.user_id,\n 291              Student.id != identifier,\n 292          )\n 293      )\n 294      if occupied or (student.user_id and student.user_id != body.user_id):\n 295          raise ApiError(409, \"ACCOUNT_BINDING_CONFLICT\", \"账号已有绑定，请通过身份核查流程处理，不能直接覆盖。\")\n 296      if student.user_id != body.user_id:\n 297          student.user_id = body.user_id\n 298          audit(db, actor, \"student.bind\", student)\n 299          await db.commit()\n 300      return data(student, *FIELDS[\"students\"])","truncated":false},"apps/api/app/schemas/education.py#StudentUpdate":{"path":"apps/api/app/schemas/education.py","symbol":"StudentUpdate","line":148,"end":150,"sha":"1f2c5ba2cbfb4f1a266414f2f942adbb29ef8d4dfbb24fa708f06f1e4bfef905","snippet":" 148  class StudentUpdate(Payload):\n 149      class_id: UUID\n 150      status: Literal[\"active\", \"inactive\"]","truncated":false},"apps/api/app/api/deps.py#get_current_student":{"path":"apps/api/app/api/deps.py","symbol":"get_current_student","line":137,"end":171,"sha":"faa28944e545ed81e84fff4b1243048e403d0665cf5a2e2b9611e7af6b2849ae","snippet":" 137  async def get_current_student(\n 138      current_user: AuthenticatedUser = Depends(get_current_user),\n 139      db: AsyncSession = Depends(get_db),\n 140  ) -> AuthenticatedStudent:\n 141      \"\"\"获取当前学生\"\"\"\n 142      # 验证是否为学生角色\n 143      if not current_user.has_role(\"STUDENT\"):\n 144          raise HTTPException(\n 145              status_code=status.HTTP_403_FORBIDDEN,\n 146              detail=\"User is not a student\"\n 147          )\n 148  \n 149      # 查询学生信息\n 150      result = await db.execute(\n 151          select(Student).where(\n 152              Student.user_id == current_user.user_id,\n 153              Student.school_id == current_user.school_id,\n 154              Student.status == \"active\"\n 155          )\n 156      )\n 157      student = result.scalar_one_or_none()\n 158  \n 159      if student is None:\n 160          raise HTTPException(\n 161              status_code=status.HTTP_404_NOT_FOUND,\n 162              detail=\"Student profile not found\"\n 163          )\n 164  \n 165      return AuthenticatedStudent(\n 166          user_id=current_user.user_id,\n 167          school_id=student.school_id,\n 168          student_id=student.id,\n 169          student_name=student.name,\n 170          roles=current_user.roles,\n 17 rRole.role_id)\n 251                  .where(UserRole.school_id == actor.school_id, Role.code == \"TEACHER\")\n 252              ),\n 253          )\n 254          .with_for_update()\n 255      )\n 256      if teacher is None:\n 257          raise ApiError(404, \"TEACHER_NOT_AVAILABLE\", \"本校教师账号不存在。\")\n 258      if teacher.display_name != body.display_name or teacher.status != body.status:\n 259          teacher.display_name, teacher.status = body.display_name, body.status\n 260          audit(db, actor, \"teacher.update\", teacher)\n 261          await db.commit()\n 262      return {\n 263          **data(teacher, \"id\", \"display_name\", \"status\"),\n 264          \"name\": teacher.display_name,\n 265      }","truncated":false},"apps/api/app/core/access_scope.py#scoped_scores":{"path":"apps/api/app/core/access_scope.py","symbol":"scoped_scores","line":77,"end":89,"sha":"1497f600599bf4b89beb60371e928e3f01a96131f884f905eb98ff00481561c6","snippet":"  77  def scoped_scores(query, user, model):\n  78      query = scoped(query, user, model.school_id)\n  79      if is_teacher_only(user):\n  80          # Correlate the subject grant with THIS student's class, never a union\n  81          # of all subjects taught in unrelated classes.\n  82          query = query.where(exists(select(TeachingAssignment.id).join(\n  83              Student, assigned_class(),\n  84          ).where(\n  85              *active_grants(user), Student.school_id == user.school_id,\n  86              Student.id == model.student_id,\n  87              TeachingAssignment.subject_id == model.subject_id,\n  88          )))\n  89      return query","truncated":false},"apps/api/app/services/school_workbench.py#set_exam_subject":{"path":"apps/api/app/services/school_workbench.py","symbol":"set_exam_subject","line":327,"end":355,"sha":"b9f344e162f6bc2056be4532f69e4a2a6356eb123869b017bd9d293df6a4cecd","snippet":" 327  async def set_exam_subject(db, actor, identifier, body):\n 328      exam = await owned(db, Exam, identifier, actor, lock=True)\n 329      native_only(exam)\n 330      await owned(db, Subject, body.subject_id, actor)\n 331      item = await db.scalar(\n 332          select(ExamSubject).where(\n 333              ExamSubject.exam_id == identifier, ExamSubject.subject_id == body.subject_id\n 334          )\n 335      )\n 336      if item and float(item.full_score) != body.full_score:\n 337          used = await db.scalar(\n 338              select(StudentSubjectScore.id)\n 339              .where(\n 340                  StudentSubjectScore.school_id == actor.school_id,\n 341                  StudentSubjectScore.exam_id == identifier,\n 342                  StudentSubjectScore.subject_id == body.subject_id,\n 343              )\n 344              .limit(1)\n 345          )\n 346          if used:\n 347              raise ApiError(409, \"EXAM_SUBJECT_REFERENCED\", \"已有成绩引用该满分，不能直接改变历史计算口径。\")\n 348      if item is None:\n 349          item = ExamSubject(exam_id=identifier, **body.model_dump())\n 350          db.add(item)\n 351      else:\n 352          item.full_score = body.full_score\n 353      audit(db, actor, \"exam.subject\", exam)\n 354      await db.commit()\n 355      return await exam_detail(db, actor, identifier)","truncated":false},"apps/api/app/schemas/education.py#ExamCreate":{"path":"apps/api/app/schemas/education.py","symbol":"ExamCreate","line":187,"end":199,"sha":"1f2c5ba2cbfb4f1a266414f2f942adbb29ef8d4dfbb24fa708f06f1e4bfef905","snippet":" 187  class ExamCreate(Payload):\n 188      external_exam_id: str = Field(min_length=1, max_length=100)\n 189      name: str = Field(min_length=1, max_length=200)\n 190      exam_type: str = Field(min_length=1, max_length=50)\n 191      start_date: date\n 192      end_date: date | None = None\n 193      status: Literal[\"active\", \"inactive\"] = \"active\"\n 194  \n 195      @model_validator(mode=\"after\")\n 196      def dates(self):\n 197          if self.end_date and self.end_date \u003c self.start_date:\n 198              raise ValueError(\"结束日期须晚于或等于开始日期\")\n 199          return self","truncated":false},"apps/api/app/services/import_workbench.py#read_files":{"path":"apps/api/app/services/import_workbench.py","symbol":"read_files","line":69,"end":89,"sha":"592ae8cd692e0ebf439d50fc61da8cd1abfa1609e56929091134ac77862b59d0","snippet":"  69  def read_files(files):\n  70      if not files or set(files) - set(REQUIRED_COLUMNS):\n  71          raise ApiError(422, \"IMPORT_FILES_INVALID\", \"请按模板上传 CSV 文件，文件名不允许路径或未知类型。\")\n  72      if sum(len(text.encode()) for text in files.values()) > 5_000_000:\n  73          raise ApiError(413, \"IMPORT_TOO_LARGE\", \"首版批次最大 5 MB、5000 行，请拆分批次。\")\n  74      result, total = {}, 0\n  75      for filename, text in files.items():\n  76          reader = csv.DictReader(io.StringIO(text.lstrip(\"\\ufeff\")))\n  77          headers = reader.fieldnames or []\n  78          if not headers or len(headers) != len(set(headers)) or len(headers) > 60:\n  79              raise ApiError(422, \"IMPORT_HEADERS_INVALID\", \"CSV 表头为空、重复或过多。\")\n  80          rows = list(reader)\n  81          total += len(rows)\n  82          if total > 5000 or any(\n  83              None in row\n  84              or any(value is None or len(value) > 5000 for value in row.values())\n  85              for row in rows\n  86          ):\n  87              raise ApiError(422, \"IMPORT_ROWS_INVALID\", \"CSV 行数超限、列数不匹配或单元格过长。\")\n  88          result[filename] = (headers, rows)\n  89      return result","truncated":false},"apps/api/app/services/import_workbench.py#upload":{"path":"apps/api/app/services/import_workbench.py","symbol":"upload","line":92,"end":130,"sha":"592ae8cd692e0ebf439d50fc61da8cd1abfa1609e56929091134ac77862b59d0","snippet":"  92  async def upload(db, actor, body, key):\n  93      parsed = read_files(body.files)\n  94      content_hash = digest(body.files)\n  95      existing = await db.scalar(\n  96          select(ImportWorkspace).where(\n  97              ImportWorkspace.school_id == actor.school_id,\n  98              ImportWorkspace.batch_key == body.batch_key,\n  99          )\n 100      )\n 101      if existing:\n 102          if (\n 103              existing.content_hash != content_hash\n 104              or existing.source_system != body.source_system\n 105          ):\n 106              raise ApiError(409, \"BATCH_CONTENT_CONFLICT\", \"该批次编号已经用于其他内容，请使用新批次编号。\")\n 107          return view(existing)\n 108      identifier, fresh = await claim(db, actor, \"import.upload\", key, body.model_dump())\n 109      if fresh:\n 110          item = ImportWorkspace(\n 111              id=identifier,\n 112              school_id=actor.school_id,\n 113              created_by=actor.user_id,\n 114              batch_key=body.batch_key,\n 115              source_system=body.source_system,\n 116              files=body.files,\n 117              content_hash=content_hash,\n 118              mapping={\n 119                  name: {\n 120                      column: column\n 121                      for column in headers\n 122                      if column in REQUIRED_COLUMNS[name] | OPTIONAL[name]\n 123                  }\n 124                  for name, (headers, _) in parsed.items()\n 125              },\n 126          )\n 127          db.add(item)\n 128          audit(db, actor, \"import.upload\", item, {\"files\": list(parsed)})\n 129          await db.commit()\n 130      return view(await owned(db, ImportWorkspace, identifier, actor))","truncated":false},"apps/api/app/api/v1/endpoints/education.py#template_create":{"path":"apps/api/app/api/v1/endpoints/education.py","symbol":"template_create","line":305,"end":345,"sha":"c0ff8cbf2a42f57bd60a8bbb0db430fedacfddcfe4659102fe68801772e2fafe","snippet":" 305  async def template_create(\n 306      body: TemplateCreate,\n 307      key: UUID | None = Header(None, alias=\"Idempotency-Key\"),\n 308      actor=Depends(writer),\n 309      db: AsyncSession = Depends(get_db),\n 310  ):\n 311      async def operation():\n 312          identifier, fresh = await claim(\n 313              db, actor, \"mapping.template\", key, body.model_dump()\n 314          )\n 315          if fresh:\n 316              if set(body.mapping) - set(imports.REQUIRED_COLUMNS):\n 317                  raise ApiError(422, \"IMPORT_MAPPING_INVALID\", \"模板包含未知文件。\")\n 318              version = (\n 319                  await db.scalar(\n 320                      select(func.max(MappingTemplate.version)).where(\n 321                          MappingTemplate.school_id == actor.school_id,\n 322                          MappingTemplate.name == body.name,\n 323                      )\n 324                  )\n 325                  or 0\n 326              ) + 1\n 327              item = MappingTemplate(\n 328                  id=identifier,\n 329                  school_id=actor.school_id,\n 330                  name=body.name,\n 331                  version=version,\n 332                  mapping=body.mapping,\n 333              )\n 334              db.add(item)\n 335              audit(db, actor, \"mapping.template\", item)\n 336              await db.commit()\n 337          return data(\n 338              await owned(db, MappingTemplate, identifier, actor),\n 339              \"id\",\n 340              \"name\",\n 341              \"version\",\n 342              \"mapping\",\n 343          )\n 344  \n 345      return await write(db, operation())","truncated":false},"apps/api/app/services/import_workbench.py#make_plan":{"path":"apps/api/app/services/import_workbench.py","symbol":"make_plan","line":158,"end":370,"sha":"592ae8cd692e0ebf439d50fc61da8cd1abfa1609e56929091134ac77862b59d0","snippet":" 158  async def make_plan(db, item):\n 159      parsed = read_files(item.files)\n 160      school = await db.get(School, item.school_id)\n 161      scope_issues = []\n 162      with TemporaryDirectory(prefix=\"education-import-\") as directory:\n 163          for filename, (headers, rows) in parsed.items():\n 164              mapping = item.mapping.get(filename, {})\n 165              if set(mapping) - (REQUIRED_COLUMNS[filename] | OPTIONAL[filename]) or any(\n 166                  source not in headers for source in mapping.values()\n 167              ):\n 168                  raise ApiError(422, \"IMPORT_MAPPING_INVALID\", \"映射包含未知目标字段或不存在的原始列。\")\n 169              target_headers = list(mapping)\n 170              with (Path(directory) / filename).open(\n 171                  \"w\", newline=\"\", encoding=\"utf-8\"\n 172              ) as handle:\n 173                  writer = csv.DictWriter(handle, fieldnames=target_headers)\n 174                  writer.writeheader()\n 175                  for row_no, row in enumerate(rows, 2):\n 176                      mapped = {\n 177                          target: row[source].strip()\n 178                          for target, source in mapping.items()\n 179                      }\n 180                      code_key = \"code\" if filename == \"schools.csv\" else \"school_code\"\n 181                      if mapped.get(code_key) != school.code:\n 182                          scope_issues.append(\n 183                              CsvIssue(\n 184                                  filename,\n 185                                  row_no,\n 186                                  \"SCHOOL_SCOPE_MISMATCH\",\n 187                                  \"学校代码必须与当前管理学校一致。\",\n 188                              )\n 189                          )\n 190                      if filename == \"schools.csv\":\n 191                          # The importer can synchronize schools, but a school UI cannot rename its tenant.\n 192                          mapped[\"name\"] = school.name\n 193                          mapped[\"external_school_id\"] = (\n 194                              school.external_school_id or school.code\n 195                          )\n 196                      writer.writerow(mapped)\n 197          plan = build_import_plan(directory, f\"web-{item.id}\")\n 198          plan.issues.extend(scope_issues)\n 199      if len(parsed.get(\"schools.csv\", ([], []))[1]) != 1:\n 200          plan.issues.append(\n 201              CsvIssue(\n 202                  \"schools.csv\", None, \"SINGLE_SCHOOL_REQUIRED\", \"每个工作台批次必须且只能包含当前学校一行。\"\n 203              )\n 204          )\n 205      full_scores = {}\n 206      for planned in plan.rows:\n 207          row, filename = planned.raw_data, planned.file_name\n 208  \n 209          def issue(code, field, message):\n 210              plan.issues.append(\n 211                  CsvIssue(filename, planned.row_number, code, f\"{field}: {message}\")\n 212              )\n 213  \n 214          for field in (\n 215              \"score\",\n 216              \"total_score\",\n 217              \"full_score\",\n 218              \"lost_score\",\n 219              \"class_rank\",\n 220              \"grade_rank\",\n 221              \"class_student_count\",\n 222              \"grade_student_count\",\n 223              \"class_avg\",\n 224              \"grade_avg\",\n 225          ):\n 226              value = row.get(field)\n 227              required = (\n 228                  field in {\"score\", \"total_score\", \"full_score\", \"lost_score\"}\n 229                  and field in REQUIRED_COLUMNS[filename]\n 230              ) or (filename == \"student_subject_scores.csv\" and field == \"full_score\")\n 231              if not value and not required:\n 232                  continue\n 233              try:\n 234                  number = Decimal(value or \"\")\n 235                  if (\n 236                      not number.is_finite()\n 237                      or number \u003c 0\n 238                      or number > 100000\n 239                      or (field == \"full_score\" and number \u003c= 0)\n 240                      or (\n 241                          (\"rank\" in field or \"count\" in field)\n 242                          and (number \u003c 1 or number != int(number))\n 243                      )\n 244                  ):\n 245                      raise ValueError()\n 246              except (InvalidOperation, ValueError):\n 247                  issue(\"INVALID_NUMBER\", field, \"须为有效非负数，满分/排名/人数须大于零\")\n 248          try:\n 249              if row.get(\"full_score\"):\n 250                  score = Decimal(row.get(\"score\") or row.get(\"total_score\") or \"0\")\n 251                  full = Decimal(row[\"full_score\"])\n 252                  if score.is_finite() and full.is_finite() and score > full:\n 253                      issue(\"SCORE_EXCEEDS_FULL\", \"score\", \"得分不能高于满分\")","truncated":true},"apps/api/app/services/import_workbench.py#preflight":{"path":"apps/api/app/services/import_workbench.py","symbol":"preflight","line":373,"end":407,"sha":"592ae8cd692e0ebf439d50fc61da8cd1abfa1609e56929091134ac77862b59d0","snippet":" 373  async def preflight(db, actor, identifier, body, key):\n 374      item = await owned(db, ImportWorkspace, identifier, actor, lock=True)\n 375      _, fresh = await claim(\n 376          db, actor, f\"import.preflight.{identifier}\", key, body.model_dump()\n 377      )\n 378      if fresh:\n 379          if item.status in {\"running\", \"succeeded\"}:\n 380              raise ApiError(409, \"IMPORT_FROZEN\", \"已确认批次不能再改变映射。\")\n 381          # Validate a separate plan before changing the stored mapping/revision.\n 382          old_mapping = item.mapping\n 383          item.mapping = body.mapping\n 384          plan = await make_plan(db, item)\n 385          item.mapping = old_mapping\n 386          report = {\n 387              \"ok\": plan.ok,\n 388              \"files\": plan.files,\n 389              \"total_rows\": len(plan.rows),\n 390              \"issues\": [i.__dict__ for i in plan.issues],\n 391              \"account_binding\": \"separate\",\n 392              \"validated_hash\": plan.content_hash,\n 393          }\n 394          await cas(\n 395 ow_hash(row)) for number, row in cleaned\n 109          )\n 110  \n 111      schools: dict[str, dict[str, str]] = {}\n 112      students: set[tuple[str, str]] = set()\n 113      exams: set[tuple[str, str]] = set()\n 114      subjects: set[tuple[str, str]] = set()\n 115      subject_codes: set[tuple[str, str]] = set()\n 116      classes: set[tuple[str, str]] = set()\n 117  \n 118      for number, row in rows_by_file.get(\"schools.csv\", []):\n 119          code = row.get(\"code\", \"\")\n 120          if code in schools:\n 121              _issue(plan, \"schools.csv\", number, \"DUPLICATE_SCHOOL\", \"学校 code 重复\")\n 122          schools[code] = row\n 123  \n 124      for number, row in rows_by_file.get(\"classes.csv\", []):\n 125          key = (row.get(\"school_code\", \"\"), row.get(\"external_class_id\", \"\"))\n 126          if key in classes:\n 127              _issue(plan, \"classes.csv\", number, \"DUPLICATE_CLASS\", \"同一学校内 external_class_id 重复\")\n 128          classes.add(key)\n 129  \n 130      for number, row in rows_by_file.get(\"students.csv\", []):\n 131          key = (row.get(\"school_code\", \"\"), row.get(\"external_student_id\", \"\"))\n 132          students.add(key)\n 133          if row.get(\"school_code\") not in schools:\n 134              _issue(plan, \"students.csv\", number, \"SCHOOL_NOT_FOUND\", \"学生所属学校不存在\")\n 135          external_class_id = row.get(\"external_class_id\")\n 136          if external_class_id and (row.get(\"school_code\", \"\"), external_class_id) not in classes:\n 137              _issue(plan, \"students.csv\", number, \"CLASS_NOT_FOUND\", \"学生所属班级不存在\")\n 138  \n 139      for number, row in rows_by_file.get(\"exams.csv\", []):\n 140          key = (row.get(\"school_code\", \"\"), row.get(\"external_exam_id\", \"\"))\n 141          exams.add(key)\n 142          if row.get(\"school_code\") not in schools:\n 143              _issue(plan, \"exams.csv\", number, \"SCHOOL_NOT_FOUND\", \"考试所属学校不存在\")\n 144  \n 145      for number, row in rows_by_file.get(\"subjects.csv\", []):\n 146          key = (row.get(\"school_code\", \"\"), row.get(\"external_subject_id\", \"\"))\n 147          code_key = (row.get(\"school_code\", \"\"), row.get(\"code\", \"\"))\n 148          if key in subjects:\n 149              _issue(plan, \"subjects.csv\", number, \"DUPLICATE_SUBJECT\", \"同一学校内 external_subject_id 重复\")\n 150          if code_key in subject_codes:\n 151              _issue(plan, \"subjects.csv\", number, \"DUPLICATE_SUBJECT_CODE\", \"同一学校内科目 code 重复\")\n 152          subjects.add(key)\n 153          subject_codes.add(code_key)\n 154          if row.get(\"school_code\") not in schools:\n 155              _issue(plan, \"subjects.csv\", number, \"SCHOOL_NOT_FOUND\", \"科目所属学校不存在\")\n 156  \n 157      for filename in (\"student_exam_scores.csv\", \"student_subject_scores.csv\", \"question_scores.csv\"):\n 158          seen: set[tuple[str, ...]] = set()\n 159          for number, row in rows_by_file.get(filename, []):\n 160              student_key = (row.get(\"school_code\", \"\"), row.get(\"external_student_id\", \"\"))\n 161              exam_key = (row.get(\"school_code\", \"\"), row.get(\"external_exam_id\", \"\"))\n 162              subject_key = (\n 163                  row.get(\"school_code\", \"\"),\n 164                  row.get(\"external_subject_id\", \"\"),\n 165              )\n 166              if row.get(\"school_code\") not in schools:\n 167                  _issue(plan, filename, number, \"SCHOOL_NOT_FOUND\", \"成绩所属学校不存在\")\n 168              if student_key not in students:\n 169                  _issue(plan, filename, number, \"STUDENT_NOT_FOUND\", \"成绩引用的学生不存在\")\n 170              if exam_key not in exams:\n 171                  _issue(plan, filename, number, \"EXAM_NOT_FOUND\", \"成绩引用的考试不存在\")\n 172              if filename != \"student_exam_scores.csv\" and subject_key not in subjects:\n 173                  _issue(plan, filename, number, \"SUBJECT_NOT_FOUND\", \"成绩引用的科目不存在\
